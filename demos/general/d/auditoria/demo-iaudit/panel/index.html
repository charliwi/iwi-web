<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>IAudit · Panel (datos de ejemplo)</title>
<style>
/* DISENO-BASE: Helvetica 700/300, Courier Prime para lo que explica, 12 columnas, linea de 24 px (tecla G), contraste por forma */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --sunk:#F3F6FA; --line:#9DB0C6; --ink:#1C2340; --acento:#0E8C99;
  --ok:#1F7A4D; --ok-soft:#E8F3ED; --warn:#7A5C00; --warn-soft:#FBF4DF; --bad:#B3261E; --bad-soft:#F9E5E3; --info:#1C2340; --info-soft:#EEF5FB;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; --typ:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1A1D2E; --surface:#20243A; --sunk:#1A1D2E; --line:#4A5275; --ink:#FAFAFA; --acento:#5FD4DE;
  --ok:#4CC38A; --ok-soft:#123326; --warn:#E3B341; --warn-soft:#2E2814; --bad:#F2675E; --bad-soft:#351819; --info:#FAFAFA; --info-soft:#2A3050}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 15px/24px var(--sans);color:var(--ink);background:var(--bg);overflow-wrap:anywhere}
.wrap{max-width:1128px;margin:0 auto;padding:24px 24px 72px;position:relative}
h1{font:300 32px/48px var(--sans);letter-spacing:-.02em;margin:0}
h1 b{font-weight:700}
h2{font:700 15px/24px var(--sans);letter-spacing:.02em;margin:48px 0 24px;text-transform:uppercase}
h3{font:700 16px/24px var(--sans);margin:0}
p,.typ,footer{font:400 14px/24px var(--typ);margin:0}
.muted{font:400 13px/24px var(--typ)}
.card{background:var(--surface);border:1px solid var(--ink);border-radius:2px}
.pad{padding:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 24px;padding-bottom:24px}
.who{border:1px solid var(--ink);border-radius:2px;padding:0 8px;font:700 12px/22px var(--sans);letter-spacing:.04em;display:inline-block}
.userbox{display:flex;flex-wrap:wrap;gap:0 12px;align-items:center}
.demo{position:sticky;top:0;z-index:60;background:var(--ink);color:var(--surface);padding:0 24px;font:400 13px/24px var(--typ);display:flex;flex-wrap:wrap;gap:0 24px;align-items:center;justify-content:space-between}
.demo select{width:auto;min-height:24px;padding:0 8px;border:0;border-radius:2px;margin:4px 0}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 0;border-bottom:2px solid var(--ink);margin-bottom:24px}
nav.tabs button{font:700 13px/24px var(--sans);letter-spacing:.02em;padding:12px 16px;border:2px solid transparent;border-bottom:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:2px 2px 0 0;margin-bottom:-2px}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.badge{display:inline-block;min-width:24px;text-align:center;border:2px solid currentColor;border-radius:2px;font:700 11px/20px var(--sans);padding:0 5px;margin-left:6px}
.badge[hidden]{display:none}
button,.btn{font:700 12px/24px var(--sans);letter-spacing:.04em;min-height:48px;padding:11px 16px;border:2px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:var(--surface)}
button.s{min-height:36px;padding:5px 12px}
button:disabled{opacity:1;border-style:dashed;cursor:not-allowed}
input,select,textarea{font:400 15px/24px var(--sans);width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--ink);border-radius:2px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical;font-family:var(--typ)}
label{display:block;font:700 11px/24px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.f{margin-bottom:12px}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.sem{display:inline-flex;align-items:center;gap:8px;border:2px solid currentColor;border-radius:2px;padding:0 10px;font:700 12px/24px var(--sans);letter-spacing:.04em;white-space:nowrap}
.sem.ok{color:var(--ok);background:var(--ok-soft)} .sem.wait{color:var(--warn);background:var(--warn-soft)} .sem.miss{color:var(--bad);background:var(--bad-soft)} .sem.plan{color:var(--info);background:var(--info-soft)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);margin:0}
.sum>div{padding:24px;border-right:1px solid var(--ink)}
.sum>div:last-child{border-right:0}
.v{font:700 48px/48px var(--sans);display:block;letter-spacing:-.02em}
.d{font:700 11px/24px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{min-height:48px;text-align:left;background:var(--surface);padding:0 12px;font:400 13px/22px var(--typ);display:block;border:1px solid var(--ink)}
.chip b{font:700 13px/22px var(--sans)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.filt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 24px;align-items:end;margin:24px 0}
.filt.f6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pt{border-bottom:1px solid var(--line)}
.pt:last-child{border-bottom:0}
.pr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;align-items:center;cursor:pointer}
.pr .n{grid-column:span 1;font:700 15px/24px var(--sans)}
.pr .lu{grid-column:span 3}
.pr .di{grid-column:span 2}
.pr .se{grid-column:span 2}
.pr .ll{grid-column:span 2;font:400 13px/20px var(--typ)}
.pr .ac{grid-column:span 2;text-align:right}
.pd{padding:12px 24px 24px;border-top:1px dashed var(--line);background:var(--sunk)}
.pd[hidden]{display:none}
.big{font:700 15px/24px var(--sans)}
.tope{border:2px solid var(--ink);border-radius:2px;padding:12px 24px;margin:24px 0;font:700 14px/24px var(--sans)}
.help{padding:24px;border-bottom:1px solid var(--line)}
.help:last-child{border-bottom:0}
.help.nueva{animation:parp 1.2s 3}
@keyframes parp{50%{background:var(--warn-soft)}}
.q{font:400 18px/24px var(--typ);margin:12px 0;max-width:62ch}
.qr{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.bar{display:grid;grid-template-columns:minmax(80px,170px) 1fr;gap:12px;align-items:center;margin-bottom:4px}
.bar .t{height:24px;border:1px solid var(--ink);border-radius:2px;background:var(--surface)}
.bar .t i{display:block;height:100%;background:var(--ink)}
.bar .l{font:700 13px/24px var(--sans)}
.bar .t span{position:relative}
.bn{font:400 13px/24px var(--typ);margin-left:8px}
.vi{padding:24px;border-bottom:1px solid var(--line)}
.vi:last-child{border-bottom:0}
.vi .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 24px}
.fotos{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.fotos img{width:120px;height:120px;object-fit:cover;border:1px solid var(--ink);border-radius:2px}
.dias{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.dias>div{padding:24px 16px;border-right:1px solid var(--ink)}
.dias>div:last-child{border-right:0}
.dias .row{display:flex;justify-content:space-between;font:400 13px/24px var(--typ)}
.dias .row b{font:700 15px/24px var(--sans)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.pp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;align-items:center;cursor:pointer}
.pp .pa{grid-column:span 3}.pp .pb{grid-column:span 2}.pp .pc{grid-column:span 2}.pp .pdd{grid-column:span 2}.pp .pe{grid-column:span 1}.pp .pst{grid-column:span 2}
.pp a.tel{display:inline-block;font:700 15px/24px var(--sans);color:var(--ink)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
a.btn.s{min-height:36px;padding:5px 12px;margin-top:4px}
a{color:var(--ink)}
.guia h1,.guia h2,.guia h3{margin:24px 0}
.guia p,.guia li{font:400 15px/24px var(--typ);max-width:72ch}
.guia ul{padding-left:24px;margin:0 0 24px}
.eq{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center}
.eq .a{grid-column:span 4}.eq .b{grid-column:span 3}.eq .c{grid-column:span 2}.eq .e{grid-column:span 3;display:flex;gap:12px}
.center{max-width:480px;margin:48px auto}
.enl{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.aviso{border:2px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:2px;padding:0 12px;font:700 13px/24px var(--sans);margin:12px 0}
.aviso.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dia h2{margin:48px 0 12px}
.diasbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;margin:0 0 12px;background:var(--bg);border-bottom:2px solid var(--line)}
.diasbar button{min-height:44px;padding:0 14px;font:700 13px/1 var(--sans)}
.diasbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.cal:first-child{border-top:0}
.cal .q{min-width:0;flex:1 1 200px}
.cal .q b{display:block;overflow-wrap:anywhere}
.sem.done{color:var(--ink);background:var(--bg)}
.calsum{font:700 15px/24px var(--sans);margin:0 0 12px}
.amb{font:400 12px/24px var(--typ);white-space:nowrap;color:var(--ink)}
.amb b{font-weight:700}
.cal .bq{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.bq .bqb{min-height:36px;padding:5px 12px;font:700 13px/24px var(--sans)}
.bq .bqb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bq .lnk{border:0;background:none;min-height:36px;padding:5px 4px;font:400 13px/24px var(--typ);text-decoration:underline;color:var(--ink);cursor:pointer}
.bq .bqm{flex:1 1 100%;font:400 12px/20px var(--typ);overflow-wrap:anywhere}
.bq .bqn{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bq .bqn input{flex:1 1 180px;min-width:0;min-height:36px;padding:5px 12px}
.bqd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:24px 0 12px}
.bqd h3{margin:0!important}
.bqc{border:2px solid var(--ink);background:var(--surface);border-radius:2px;padding:12px;margin:0 0 12px}
.ct .amb{white-space:normal}
.bod{padding:24px;border-bottom:1px solid var(--line)}
.bod:last-child{border-bottom:0}
.bod .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 24px}
.bod .asig{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:12px}
.bod .asig .f{flex:1 1 240px;margin:0}
.ag{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center}
.ag:last-child{border-bottom:0}
.ag .a{grid-column:span 3}.ag .b{grid-column:span 3}.ag .c{grid-column:span 3}.ag .e{grid-column:span 3}
.dir{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center}
.dir:last-child{border-bottom:0}
.dir .a{grid-column:span 3}.dir .b{grid-column:span 1}.dir .c{grid-column:span 6}.dir .e{grid-column:span 2;text-align:right}
.bulk{padding:24px;margin:24px 0}
.bulk .row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.bulk .row .f{flex:1 1 200px;margin:0}
.pr .n{display:flex;align-items:center;gap:8px}
.pr .n input{width:24px;min-height:24px;height:24px;padding:0;margin:0}
#toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:2px;padding:12px 16px;font:700 14px/24px var(--sans);z-index:20}
#toast[hidden]{display:none}
.sum.s5{grid-template-columns:repeat(5,1fr)}
.v.bad{color:var(--bad)}
.ct,.cth{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;align-items:start}
.ct{border-bottom:1px solid var(--line)} .ct:last-child{border-bottom:0}
.cth{border-bottom:2px solid var(--ink);font:700 11px/24px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding-top:8px;padding-bottom:8px}
.ct>.k1,.cth>.k1{grid-column:span 3}.ct>.k2,.cth>.k2{grid-column:span 2}.ct>.k3,.cth>.k3{grid-column:span 1}.ct>.k4,.cth>.k4{grid-column:span 1}.ct>.k5,.cth>.k5{grid-column:span 2}.ct>.k6,.cth>.k6{grid-column:span 3}
.ct>.k3,.ct>.k4{font:700 15px/24px var(--sans)}
.ct>[data-l]::before{display:none}
.etqs{display:flex;flex-wrap:wrap;gap:8px}
.ct>.kf{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font:400 13px/24px var(--typ)}
.ct>.kf b{font:700 14px/24px var(--sans)}
.ct>.kf .mv{flex-basis:100%}
.cam{margin:24px 0}
.cam h2{margin:0 0 8px}
.cam ul{list-style:none;margin:12px 0;padding:0}
.cam li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font:400 14px/24px var(--sans)}
.cam li:last-child{border-bottom:0}
.mv .fr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0}
.mv .fr>div{min-width:160px;flex:1 1 160px}
.pre{white-space:pre-wrap;font:400 13px/20px var(--typ);margin:0;width:100%;min-height:144px}
.eq2{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:12px 24px;border-bottom:1px solid var(--line);align-items:center}
.eq2:last-child{border-bottom:0}
.eq2 .a{grid-column:span 2}.eq2 .b{grid-column:span 3}.eq2 .c{grid-column:span 2}.eq2 .d2{grid-column:span 3}.eq2 .e2{grid-column:span 2}
.eq2 .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.eq2 .act select{width:auto;min-width:160px}
.eq2 .conf{grid-column:1/-1;border:2px solid var(--bad);background:var(--bad-soft);border-radius:2px;padding:12px;margin-top:8px}
.pres{margin:4px 0 0}
.pres b{font:700 15px/24px var(--sans)}
.cuentas{display:flex;flex-wrap:wrap;gap:12px}
.cuentas .cu{border:1px solid var(--ink);border-radius:2px;background:var(--surface);padding:8px 12px;min-width:200px}
.grid-on .wrap::after{content:"";position:absolute;inset:0 24px;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(to bottom,rgba(217,50,50,.28) 0 1px,transparent 1px 24px),
  repeating-linear-gradient(to right,rgba(14,140,153,.16) 0 calc((100% - 264px)/12),transparent calc((100% - 264px)/12) calc((100% - 264px)/12 + 24px))}
@media (max-width:860px){
  .filt,.filt.f6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum{grid-template-columns:repeat(2,1fr)} .sum>div{border-bottom:1px solid var(--ink)} .sum>div:nth-child(2n){border-right:0} .sum>div:nth-last-child(-n+2){border-bottom:0}
  .dias{grid-template-columns:1fr} .dias>div{border-right:0;border-bottom:1px solid var(--ink)} .dias>div:last-child{border-bottom:0}
  .two{grid-template-columns:1fr}
  .pr{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 16px;row-gap:4px}
  .pr .n,.pr .lu,.pr .di,.pr .se,.pr .ll,.pr .ac{grid-column:auto}
  .pr .lu{grid-column:1/-1} .pr .ac{text-align:left}
  .sum[style*="repeat(6"]{grid-template-columns:repeat(2,1fr)!important}
  .pp{grid-template-columns:minmax(0,1fr);padding:12px 16px;row-gap:4px}
  .pp .pa,.pp .pb,.pp .pc,.pp .pdd,.pp .pe,.pp .pst{grid-column:auto}
  .pp a.tel{min-height:36px;padding-top:6px}
  a.btn.s{min-height:48px;padding-top:11px}
  .pd{padding:12px 16px 24px}
  .eq .a,.eq .b,.eq .c,.eq .e{grid-column:1/-1}
  .ag,.dir{grid-template-columns:minmax(0,1fr);padding:12px 16px;row-gap:4px}
  .ag .a,.ag .b,.ag .c,.ag .e,.dir .a,.dir .b,.dir .c,.dir .e{grid-column:auto;text-align:left}
  .bod{padding:16px}
}
@media (max-width:860px){
  .sum.s5{grid-template-columns:repeat(2,1fr)}
  .sum.s5>div:nth-last-child(2){border-bottom:1px solid var(--ink)}
  .sum.s5>div:last-child{grid-column:1/-1;border-right:0}
  .cth{display:none}
  .ct{grid-template-columns:minmax(0,1fr);row-gap:4px;padding:12px 16px}
  .ct>.k1,.ct>.k2,.ct>.k3,.ct>.k4,.ct>.k5,.ct>.k6{grid-column:auto}
  .ct>[data-l]::before{display:inline;content:attr(data-l) ": ";font:700 11px/24px var(--sans);letter-spacing:.08em;text-transform:uppercase}
  .ct>.k3,.ct>.k4{font:400 14px/24px var(--typ)}
  .eq2{grid-template-columns:minmax(0,1fr);padding:12px 16px;row-gap:4px}
  .eq2 .a,.eq2 .b,.eq2 .c,.eq2 .d2,.eq2 .e2{grid-column:auto}
}
@media (max-width:620px){
  .wrap{padding:16px 16px 48px} h1{font-size:26px;line-height:36px}
  .pad,.help,.vi,.bulk{padding:16px}
  .demo{padding:0 16px}
  nav.tabs button{padding:12px 10px}
  .v{font-size:36px}
}
/* ===== importar, tiempos, tablas ===== */
.tw{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font:400 13px/20px var(--typ)}
table.rt th{white-space:nowrap;font:700 11px/24px var(--sans);letter-spacing:.1em;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ink);padding:8px 12px;vertical-align:bottom}
table.rt td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.rt tr:last-child td{border-bottom:0}
table.rt td.tel{white-space:nowrap}
table.rt td.num,table.rt th.num{text-align:right;white-space:nowrap}
table.rt td b{font:700 14px/20px var(--sans)}
table.rt td select{min-height:36px;padding:5px 8px;font-size:13px}
table.rt td input[type=checkbox]{width:24px;min-height:24px;height:24px;padding:0}
table.rt tr.off td{background:var(--sunk)}
.etqs.col{flex-direction:column;align-items:flex-start}
.pbar{height:24px;border:1px solid var(--ink);border-radius:2px;background:var(--surface);margin:12px 0}
.pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.conf2{border:2px solid var(--bad);background:var(--bad-soft);border-radius:2px;padding:12px;margin-top:12px}
.conf2 select{margin:12px 0}
.mapa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;margin:12px 0 24px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);margin:0}
.mini>div{padding:24px;border-right:1px solid var(--ink)}
.mini>div:last-child{border-right:0}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:8px 24px;border-bottom:1px solid var(--line);align-items:center}
.rk:last-child{border-bottom:0}
.rk .t2{grid-column:1/-1;height:12px;border:1px solid var(--ink);border-radius:2px;background:var(--surface);margin:4px 0 0}
.rk .t2 i{display:block;height:100%;background:var(--ink)}
.rk b{font:700 14px/24px var(--sans)}
.rk span.m{font:400 13px/24px var(--typ);text-align:right}
@media (min-width:861px){
  .ct>.k4,.cth>.k4{grid-column:span 2}.ct>.k6,.cth>.k6{grid-column:span 2}
}
.ct>.k4{font:400 13px/20px var(--typ)}
.ct>.k4 b{font:700 13px/20px var(--sans)}
@media (max-width:860px){
  .tw{overflow:visible}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{padding:12px 0;border-bottom:1px solid var(--line)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{border:0;padding:2px 16px;text-align:left!important}
  table.rt td::before{content:attr(data-l) ": ";font:700 11px/24px var(--sans);letter-spacing:.08em;text-transform:uppercase}

const F_CONOCIDOS=['sin agencia ni persona','sin agencia','faltan personas','sin llegada','visita sin terminar'];
const VISITA_FIN=['terminada','revisada','pagada'];
function faltControl(r,hoy){
  const out=[],req=+r.requeridas||0,asg=+r.asignadas||0,dia=String(r.fecha||'').slice(0,10),pasado=dia&&dia<=hoy;
  if(!r.agencia)out.push(['✖','miss',asg?'sin agencia':'sin agencia ni persona']);
  if(asg<req&&(r.agencia||asg))out.push(['▲','wait','faltan personas']);
  if(pasado&&!r.llego)out.push(['✖','miss','sin llegada']);
  if(pasado&&r.llego&&!VISITA_FIN.includes(r.visita_estado))out.push(['▲','wait','visita sin terminar']);
  (r.faltantes||[]).forEach(t=>{if(t&&!F_CONOCIDOS.includes(t))out.push(['▲','wait',String(t)])});
  return out;
}
const dia10=v=>v?String(v).slice(0,10):'';
/* fecha programada vs. fecha real (la real la sella la base: primera llegada o inicio de visita, hora CDMX) */
function fechaInfo(r,hoy){
  const prog=dia10(r.fecha),real=dia10(r.fecha_real);
  const cambio=!!real&&(r.cambio_fecha===true||real!==prog);
  const sinHacer=!real&&!r.llego&&!!prog&&prog<hoy;
  let etq=null;
  if(real)etq=real===prog?['✔','ok','en su fecha']:(real<prog?['▲','wait','adelantada']:['▲','wait','atrasada']);
  else if(sinHacer)etq=['✖','miss','sin hacer: pasó su fecha'];
  return {prog,real,cambio,sinHacer,etq};
}
function cambiosControl(rows,hoy){
  const L=rows.map(r=>({r,fi:fechaInfo(r,hoy)})).sort((a,b)=>a.fi.prog.localeCompare(b.fi.prog)||(+a.r.orden||0)-(+b.r.orden||0));
  return {cambios:L.filter(x=>x.fi.cambio),pend:L.filter(x=>x.fi.sinHacer)};
}
function cambiosTexto(rows,hoy){
  const {cambios,pend}=cambiosControl(rows,hoy),T=['IAudit · cambios de fecha'];
  cambios.forEach(({r,fi})=>T.push(r.municipio+': programada '+diaLabel(fi.prog)+', hecha '+diaLabel(fi.real)));
  if(pend.length)T.push('Pendientes de reprogramar: '+pend.map(x=>x.r.municipio).join(', '));
  if(!cambios.length&&!pend.length)T.push('Sin cambios de fecha.');
  return T.join('\n');
}

  await datos.asignarAgencia(ids,nombre,YO.nombre);

/* ===== Vista de la agencia: Mis bodegas y Mi gente ===== */
/* Presencia de la gente de la agencia: sólo hora de llegada y tiempo en sitio, nunca ubicación */
function presTxt(x){
  if(!x.llego)return 'Aún no llega';
  if(x.fin){const m=x.minutos_en_sitio!=null?x.minutos_en_sitio:(new Date(x.fin)-new Date(x.llego))/60000;return 'Terminó '+hora(x.fin)+' · '+durTxt(m)+' en sitio'}
  if(x.inicio){const m=Math.floor((Date.now()-new Date(x.llego))/60000);return 'En sitio hace '+durTxt(m)+' · llegó a las '+hora(x.llego)}
  return 'Llegó a las '+hora(x.llego);
}
function presAvance(x){
  if(!x.llego)return '';
  const e=x.visita&&ESTV[x.visita]?ESTV[x.visita][2]:'',av=x.avance!=null&&x.avance!==''?pct(x.avance)+'%':'';
  if(!e&&!av)return 'Visita sin iniciar';
  return 'Visita: '+[e,av].filter(Boolean).join(' · ');
}
function bodInd(ps){
  if(!ps.length)return ['miss','✖','sin personas'];
  const ll=ps.filter(x=>x.llego).length,fin=ps.filter(x=>x.fin).length;
  if(!ll)return ['wait','▲','por llegar'];
  if(fin===ps.length)return ['ok','✔','terminó'];
  return ['ok','✔','en sitio'+(ps.length>1?' ('+ll+' de '+ps.length+')':'')];
}
const diaCorto=d=>{const t=new Date(String(d).slice(0,10)+'T12:00:00');return ['dom','lun','mar','mié','jue','vie','sáb'][t.getDay()]+' '+t.getDate()};

const MG_IMP=[['nombre','Nombre completo'],['telefono','Celular'],['estado','Estado'],['ciudad','Ciudad'],['correo','Correo'],['zona','Zona'],['disponibilidad','Disponibilidad']];
const MG_SIN=[['telefono',h=>/tel|cel|movil|whats/.test(h)],['correo',h=>/correo|mail/.test(h)],['estado',h=>/^estado|^entidad|^edo/.test(h)],['disponibilidad',h=>/^disponib|^dias|^horario/.test(h)],

function mgDetectar(heads){const map={};MG_IMP.forEach(c=>map[c[0]]=-1);const usado=new Set(),hn=heads.map(h=>norm(h));
  MG_SIN.forEach(([f,fn])=>{const i=hn.findIndex((h,k)=>h&&!usado.has(k)&&fn(h));if(i>=0){map[f]=i;usado.add(i)}});return map}
async function leerTabla(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();let raw,hoja='';
  const buf=await file.arrayBuffer();
  if(['csv','txt','tsv'].includes(ext))raw=parseCSV(decodificar(buf));
  else if(['xlsx','xls','xlsm'].includes(ext)){
    if(!window.XLSX)throw new Error('No cargó el lector de Excel (¿sin internet?). Abre el archivo en Excel, guárdalo como CSV y súbelo de nuevo.');
    const wb=XLSX.read(buf,{type:'array'});
    for(const n of wb.SheetNames){const rr=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(rr.filter(x=>x.some(c=>impCelda(c)!=='')).length>=2){raw=rr;hoja=n;break}}
    if(!raw)throw new Error('El archivo no tiene filas con datos.');
  }else throw new Error('Ese tipo de archivo no se puede leer. Sube un .xlsx, .xls o .csv.');
  raw=raw.map(r=>r.map(impCelda)).filter(r=>r.some(c=>c!==''));
  if(raw.length<2)throw new Error('El archivo necesita un encabezado y al menos una persona.');
  return {raw,hoja};
}

function mgImpRecalc(){

  const visto=new Map(),filas=[];

/* ===== Personal: importar el Excel de una agencia ===== */
const IMP_CAMPOS=[['nombre','Nombre'],['telefono','Teléfono o celular'],['estado','Estado'],['ciudad','Ciudad'],['dia','Día o fecha'],['bodega','Bodega o ciudad de la bodega']];
/* orden de asignación: cada encabezado se usa una sola vez */
const IMP_SIN=[['telefono',h=>/tel|cel|movil|whats/.test(h)],['estado',h=>/^estado|^entidad|^edo/.test(h)],['dia',h=>/^dia|^fecha|jornada/.test(h)],
  ['nombre',h=>/nombre|persona|contador|auditor|empleado/.test(h)&&!/bodega|sucursal|sede/.test(h)],['bodega',h=>/bodega|sucursal|sede|cedis/.test(h)],['ciudad',h=>/ciudad|municipio|localidad|plaza/.test(h)]];
function impDetectar(heads){const map={};IMP_CAMPOS.forEach(c=>map[c[0]]=-1);const usado=new Set();const hn=heads.map(h=>norm(h));
  IMP_SIN.forEach(([f,fn])=>{const i=hn.findIndex((h,k)=>h&&!usado.has(k)&&fn(h));if(i>=0){map[f]=i;usado.add(i)}});return map}
const impCelda=v=>{if(v==null)return '';if(typeof v==='number')return Number.isInteger(v)?String(v):String(v);if(v instanceof Date)return v.toISOString().slice(0,10);return String(v).trim()};
function parseCSV(t){
  t=String(t||'').replace(/^﻿/,'');const l1=t.split(/\r?\n/)[0]||'';
  const cnt=c=>l1.split(c).length-1;const d=[',',';','\t'].map(c=>[c,cnt(c)]).sort((a,b)=>b[1]-a[1])[0];const dl=d[1]?d[0]:',';
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.map(x=>x.map(s=>s.trim()));
}
function decodificar(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
const MESES_L=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const p2=n=>String(n).padStart(2,'0');
function diaDe(v){
  if(v==null||v==='')return {iso:null,txt:''};
  const ok=(y,m,d)=>{if(m<1||m>12||d<1||d>31)return null;return y+'-'+p2(m)+'-'+p2(d)};
  if(typeof v==='number'){
    if(v>=40000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);return {iso:d.toISOString().slice(0,10),txt:String(v)}}
    if(v>=1&&v<=31)return {iso:ok(2026,11,v),txt:String(v)};return {iso:null,txt:String(v)}}
  if(/^\d{5}(\.\d+)?$/.test(String(v).trim()))return diaDe(+String(v).trim());
  const s=String(v).trim(),n=s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();let m;
  if((m=n.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)))return {iso:ok(+m[1],+m[2],+m[3]),txt:s};
  if((m=n.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)))return {iso:ok(+m[3]<100?2000+ +m[3]:+m[3],+m[2],+m[1]),txt:s};
  if((m=n.match(/(\d{1,2})\s*(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/)))return {iso:ok(2026,MESES_L.indexOf(m[2])+1,+m[1]),txt:s};
  if((m=n.match(/(ene|feb|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*\.?\s*(\d{1,2})/)))return {iso:ok(2026,MESES_L.indexOf(m[1])+1,+m[2]),txt:s};   /* «mar 17» es martes 17, no marzo */
  if((m=n.match(/marzo\s*(\d{1,2})/)))return {iso:ok(2026,3,+m[1]),txt:s};
  if((m=n.match(/(?:^|\D)(\d{1,2})(?:\D|$)/)))return {iso:ok(2026,11,+m[1]),txt:s};
  return {iso:null,txt:s};
}
async function impLeer(file){
  const I=S.imp;I.msg='';
  const ext=(file.name.split('.').pop()||'').toLowerCase();let raw;
  const buf=await file.arrayBuffer();
  if(['csv','txt','tsv'].includes(ext))raw=parseCSV(decodificar(buf));
  else if(['xlsx','xls','xlsm'].includes(ext)){
    if(!window.XLSX)throw new Error('No cargó el lector de Excel (¿sin internet?). Abre el archivo en Excel, guárdalo como CSV y súbelo de nuevo.');
    const wb=XLSX.read(buf,{type:'array'});let hoja=null;
    for(const n of wb.SheetNames){const rr=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(rr.filter(x=>x.some(c=>impCelda(c)!=='')).length>=2){raw=rr;hoja=n;break}}
    if(!raw)throw new Error('El archivo no tiene filas con datos.');I.hoja=hoja;
  }else throw new Error('Ese tipo de archivo no se puede leer. Sube un .xlsx, .xls o .csv.');
  raw=raw.map(r=>r.map(impCelda)).filter(r=>r.some(c=>c!==''));
  if(raw.length<2)throw new Error('El archivo necesita un encabezado y al menos una persona.');

  I.archivo=file.name;I.raw=raw;I.hdr=hdr;I.headers=raw[hdr];I.map=impDetectar(I.headers);I.sel={};I.fase='previa';
  impRecalc();

function calendarioHtml(cal){

  const rows=cal.slice().sort((a,b)=>dia10(a.fecha).localeCompare(dia10(b.fecha))||(+a.orden||0)-(+b.orden||0));
  const dias={};rows.forEach(r=>(dias[dia10(r.fecha)]=dias[dia10(r.fecha)]||[]).push(r));
  const ks=Object.keys(dias).sort();
  if(S.cliDia&&!dias[S.cliDia])S.cliDia='';
  const CD=S.cliDia,n=x=>rows.filter(r=>sitCli(r)===x).length;
  const conP=n('con persona'),sitio=n('en sitio'),ter=n('terminada');
  const bqSi=rows.filter(r=>bqEstado(r)==='si').length,bqNc=rows.filter(r=>bqEstado(r)==='nc').length,bqNo=rows.filter(r=>bqEstado(r)==='no').length;
  const cli=puedeBloqueo(),interno=YO&&YO.rol!=='cliente';
  const fila=r=>{
    const sc=sitCli(r),c=SIT_CLI[sc],prog=dia10(r.fecha),real=dia10(r.fecha_real);
    const extra=[r.tipo||'Sin dato'];
    if((+r.personas_req||0)>=2)extra.push('2 personas');
    if(real&&real!==prog)extra.push('Se hizo el '+diaLabel(real));
    return `<div class="cal" data-punto="${esc(r.punto_id)}"><span class="q"><b>${esc(r.municipio)}, ${esc(r.estado)}</b><span class="muted">${esc(extra.join(' · '))}</span></span><span class="sem ${c[0]}"><span aria-hidden="true">${c[1]}</span> ${esc(sc==='programada'?'programada, '+c[2]:(sc==='con persona'?'con persona, '+c[2]:sc))}</span>${cli?bloqueoHtml(r):ambosHtml(r)}</div>`;
  };
  const cabeza=d=>{
    const xs=dias[d],faltan=xs.filter(r=>bqEstado(r)!=='si'),noB=faltan.filter(r=>bqEstado(r)==='no').length,pr=S.bq.prog&&S.bq.prog.d===d?S.bq.prog:null;
    const h=`<h3 style="margin:24px 0 12px">${esc(diaLabel(d))} · ${xs.length} ${xs.length===1?'bodega':'bodegas'}</h3>`;
    if(!cli)return h;
    let caja='';
    if(pr)caja=`<div class="bqc" role="status"><p><b>Marcando ${pr.i} de ${pr.n}…</b> No cierres esta página.</p></div>`;
    else if(S.bq.dia===d&&faltan.length)caja=`<div class="bqc" role="alertdialog" aria-label="Confirmar bloqueo del día"><p><b>¿Marcar como bloqueadas las ${faltan.length===1?'1 bodega':faltan.length+' bodegas'} de ${esc(diaLabel(d))} que faltan?</b>${noB?' Incluye '+noB+' que '+(noB===1?'está':'están')+' como «No bloqueada»; su nota se borra.':''}</p><div class="qr" style="margin:12px 0 0"><button type="button" class="p s" data-a="bq-dia-si" data-d="${esc(d)}">Sí, marcar todo</button><button type="button" class="s" data-a="bq-dia-no">Cancelar</button></div></div>`;
    return `<div class="bqd">${h}${faltan.length?`<button type="button" class="s" data-a="bq-dia" data-d="${esc(d)}"${S.bq.prog?' disabled':''}>Marcar todo el día como bloqueado</button>`:'<span class="muted">Todo el día bloqueado</span>'}</div>${caja}`;
  };
  const lista=ks.filter(d=>!CD||d===CD).map(d=>`<section class="dia">${cabeza(d)}<div class="card">${dias[d].map(fila).join('')}</div></section>`).join('')||'<div class="card pad"><p>Todavía no hay bodegas en el calendario.</p></div>';
  return `<section aria-labelledby="calT" style="margin-bottom:48px"><h2 id="calT" style="margin-top:0">Calendario del conteo</h2>
  <p class="calsum">${rows.length} ${rows.length===1?'bodega':'bodegas'} · ${conP} con persona asignada · ${sitio} en sitio · ${ter} ${ter===1?'terminada':'terminadas'} · ${bqSi} ${bqSi===1?'bloqueada':'bloqueadas'} por el cliente · ${bqNc} sin confirmar${bqNo?' · '+bqNo+' no '+(bqNo===1?'bloqueada':'bloqueadas'):''}</p>
  ${cli?'<p class="muted" style="margin:0 0 12px">Avísanos, bodega por bodega, si de su lado ya está bloqueado el servicio para el día del conteo. Puedes cambiarlo cuando quieras.</p>':(interno?'<p class="muted" style="margin:0 0 12px">Ambos lados: personal ● con persona, ◆ sin persona · bloqueo del cliente ● bloqueada, ◆ sin confirmar, ✖ no bloqueada.</p>':'')}
  ${barraDias('cli-dia',ks.map(d=>[d,dias[d].length]),CD,rows.length)}
  <div class="qr" style="margin:0 0 12px"><button class="p" data-a="copiar-calendario"${rows.length?'':' disabled'}>Copiar calendario</button></div>
  ${S.cliTxt?`<div class="f" style="margin-bottom:12px"><label for="cliTxt">Texto listo para pegar</label><textarea id="cliTxt" class="pre" readonly>${esc(S.cliTxt)}</textarea></div>`:''}
  ${lista}</section>`;
}
async function recargarCalendario(){const cal=await datos.calendarioCliente().catch(()=>null);if(cal)S.cliCal=cal;pintarCliente()}
async function marcarBloqueo(id,bloqueada,nota){
  if(S.bq.ocup[id]||S.bq.prog)return;
  S.bq.ocup[id]=true;pintarCliente();
  try{await datos.marcarBloqueo(id,bloqueada,nota);delete S.draft['bqn:'+id]}
  finally{delete S.bq.ocup[id];await recargarCalendario()}
}
async function marcarDiaBloqueado(d){
  if(S.bq.prog)return;
  const xs=(S.cliCal||[]).filter(r=>dia10(r.fecha)===d&&bqEstado(r)!=='si').sort((a,b)=>(+a.orden||0)-(+b.orden||0));
  S.bq.dia=null;S.bq.nota=null;if(!xs.length){pintarCliente();return}
  let mal=0;S.bq.prog={d,i:0,n:xs.length};
  try{for(const r of xs){S.bq.prog.i++;pintarCliente();try{await datos.marcarBloqueo(r.punto_id,true,null);delete S.draft['bqn:'+r.punto_id]}catch(e){mal++}}}
  finally{S.bq.prog=null;await recargarCalendario()}
  aviso(mal?'No se pudieron marcar '+mal+' de '+xs.length+'. Intenta de nuevo con las que faltan.':'Listo: '+diaLabel(d)+' quedó bloqueado ('+xs.length+').');
}
async function cargarCliente(){
  const [m,cal]=await Promise.all([datos.metricas(),datos.calendarioCliente().catch(()=>null)]);
  S.cliCal=cal;S.cliM=m;

}

  const ord=x=>{const i=PANTALLAS_ORDEN.indexOf(x.pantalla);return i<0?99:i};pan.sort((a,b)=>ord(a)-ord(b));

  <div class="card dias" role="group" aria-label="Avance por día">${dias.map(d=>`<div><span class="big">${esc(diaLabel(d.fecha))}</span><span class="v">${+d.puntos||0}</span><span class="d">puntos</span>
    <div class="row" style="margin-top:12px"><span>En curso</span><b>${+d.visitas_en_curso||0}</b></div><div class="row"><span>Terminadas</span><b>${+d.terminadas||0}</b></div><div class="row"><span>Revisadas</span><b>${+d.revisadas||0}</b></div></div>`).join('')||'<div class="pad"><p>Sin datos todavía.</p></div>'}</div>
  <div class="card sum" style="margin-top:24px;grid-template-columns:repeat(3,1fr)">
   <div><span class="v">${av}%</span><span class="d">Avance medio</span></div>
   <div><span class="v">${+m.ayudas_abiertas||0}</span><span class="d">Ayudas abiertas</span></div>
   <div><span class="v">${mmss(m.tiempo_medio_respuesta_seg)}</span><span class="d">Tiempo medio de respuesta</span></div></div>
  <div class="two" style="margin-top:48px"><div><h2 style="margin-top:0">Segundos promedio por pantalla</h2>${pan.length?barras(pan.map(x=>({label:x.pantalla,val:x.segundos,veces:x.veces})),i=>mmss(i.val)+' · '+(i.veces||0)+' veces'):'<p>Sin datos todavía.</p>'}</div>
  ${interno?`<div><h2 style="margin-top:0">Cobertura de los puntos</h2><div class="card sum" style="grid-template-columns:repeat(3,1fr)">
   <div><span class="v">${+cob.verde||0}</span><span class="d">● Verde</span></div><div><span class="v">${+cob.amarillo||0}</span><span class="d">◆ Amarillo</span></div><div><span class="v">${+cob.rojo||0}</span><span class="d">▲ Rojo</span></div></div></div>`:''}</div>`;
  pintar(html,JSON.stringify([S.cliDia,S.cliTxt,YO&&YO.rol,cal,S.bq]));
}

/* ===== Bodegas: tablero para el cliente (sólo lectura; el bloqueo se marca en Vista cliente) ===== */
/* situación: [clase de color, icono, texto, grupo]; grupo 0 = con incidencia, 1 = en curso, 2 = terminada, 3 = por visitar */
const TB_SIT={'sin registro':['miss','▲','Sin registro',0],'detenida':['inc','■','Detenida',0],'sin conteo':['inc','✖','Sin conteo',0],'no se pudo auditar':['inc','⊘','No se pudo auditar',0],'en sitio':['wait','◆','En sitio',1],'contando':['wait','▶','Contando',1],'terminada':['ok','✔','Terminada',2],'con persona':['plan','●','Con persona asignada',3],'reprogramada':['rep','↻','Reprogramada',3],'programada':['plan','○','Programada',3]};
const TB_SINMOV='~sinmov',TB_SINMOV_MIN=30;
const tbSit=r=>TB_SIT[r.situacion]?r.situacion:'programada';
const tbSitTxt=k=>TB_SIT[k]?TB_SIT[k][2]:String(k||'');
const tbHora=iso=>hora(iso).replace(/^0(\d)/,'$1');
const tbNum=v=>v==null||v===''||!isFinite(+v)?null:+v;
const tbCuenta=(n,uno,varios)=>n.toLocaleString('es-MX')+' '+(n===1?uno:varios);
function tbPersonas(v){
  if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){v=[v]}}
  if(!Array.isArray(v))return null;
  return v.map(x=>String(x&&typeof x==='object'?(x.nombre||''):(x==null?'':x)).trim()).filter(Boolean);
}
const tbLista=xs=>xs.length>1?xs.slice(0,-1).join(', ')+' y '+xs[xs.length-1]:xs.join('');
const tbCoincide=(r,q)=>!q||norm([r.codigo,r.nombre_bodega,r.municipio,r.estado].filter(Boolean).join(' ')).includes(q);
/* tiempo real (RPC tablero_vivo): una fila por visita; por bodega se queda la que está en curso o, si no, la de actividad más reciente */
const exT=x=>{const t=x?Date.parse(x):NaN;return isFinite(t)?t:null};
const exObj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
const corta=(s,n)=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).trimEnd()+'…':s};
const haceTxt=ms=>{const m=Math.max(0,Math.round(ms/60000));if(m<1)return 'hace menos de 1 min';if(m<60)return 'hace '+m+' min';if(m<2880){const h=Math.floor(m/60),x=m%60;return 'hace '+h+' h'+(x?' '+x+' min':'')}return 'hace '+Math.floor(m/1440)+' días'};
const diaMX=iso=>{try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:TZ})}catch(e){return ''}};
/* nombre legible de una pantalla de la app. Las preguntas (q:N) salen del catálogo de preguntas, que se lee una vez por sesión;
   si el catálogo no se pudo leer queda «Pregunta N». Nunca se muestra el código crudo. */
const PANT={intro:'Inicio de la visita',reglas:'Reglas de la visita',apertura:'Apertura',datos:'Datos de la bodega',sec_pre:'Antes del conteo',sku:'Conteo de productos',sec_post:'Después del conteo',cierre:'Cierre',general:'General'};
function pantInfo(p){
  p=String(p==null?'':p).trim();const m=/^q:(.+)$/.exec(p);
  if(m){const k=S.preg&&S.preg.map&&S.preg.map[m[1]];return k&&k.texto?{t:m[1]+'. '+corta(k.texto,80),full:m[1]+'. '+k.texto,sec:k.seccion||''}:{t:'Pregunta '+m[1],full:'Pregunta '+m[1],sec:''}}
  const t=PANT[p]||(p?(p.charAt(0).toUpperCase()+p.slice(1)).replace(/_/g,' '):'Sin nombre');return {t,full:t,sec:''};
}
const exPantalla=p=>pantInfo(p).t;
async function cargarPreg(){
  if(S.preg||!YO||!['iwi','coordinador','apoyo','cliente'].includes(YO.rol))return;
  try{const rs=await datos.preguntasCatalogo(),map={};(Array.isArray(rs)?rs:[]).forEach(q=>{if(q&&q.id!=null)map[String(q.id)]={texto:q.texto||'',seccion:q.seccion||''}});S.preg={map}}
  catch(e){if(e&&e.status===401)throw e;S.preg={map:{},err:true}}

/* tiempos en rejilla (3 columnas en escritorio): cada celda dice qué dato es, con barra corta y el tiempo a la derecha; puede agruparse por sección del cuestionario */
function barras(items,fmt,grupos){
  const mx=Math.max(1,...items.map(i=>+i.val||0));
  const celda=i=>`<div class="bc${i.at?' lkr':''}"${i.at?' role="link" tabindex="0" '+i.at:''}${i.title?` title="${esc(i.title)}"`:''}><span class="bcn">${esc(i.label)}${!grupos&&i.sec?` <span class="bcs">${esc(i.sec)}</span>`:''}${i.extra||''}</span><span class="bcb" aria-hidden="true"><i style="width:${Math.max(2,Math.round((+i.val||0)/mx*100))}%"></i></span><span class="bct">${esc(fmt(i))}</span></div>`;
  if(!grupos)return `<div class="bg">${items.map(celda).join('')}</div>`;
  const g=[];items.forEach(i=>{const k=i.sec||'Pasos de la visita';let x=g.find(y=>y.k===k);if(!x)g.push(x={k,xs:[]});x.xs.push(i)});
  return g.map(x=>`<p class="bgt">${esc(x.k)}</p><div class="bg">${x.xs.map(celda).join('')}</div>`).join('');
}
/* enlaces cruzados dentro de la bodega: q:<id> pregunta · sku:<código> · foto:<id de pregunta> · msg:<id de aviso> · sec:<sección>.
   Si el rol no puede ver el destino, el texto no es enlace. */
const exDestSec=d=>{const t=String(d).split(':')[0];return {q:'hallazgos',sku:'conteo',foto:'fotos',evi:'fotos',msg:'avisos'}[t]||String(d).slice(4)};
const exPuedeIr=d=>{if(!d||!YO)return false;const R=EX_ROL[YO.rol]||[];return R.includes(exDestSec(d))&&(!/^q:/.test(String(d))||exInterno())};
const exLk=(d,html,tit)=>exPuedeIr(d)?`<a href="#" class="lk" data-a="ex-ir" data-d="${esc(d)}"${tit?` title="${esc(tit)}"`:''}>${html}</a>`:html;
const exDestPant=p=>{p=String(p||'');return /^q:/.test(p)?p:(p==='sku'?'sec:conteo':'')};
/* va a un destino dentro de la bodega abierta: abre su sección, hace scroll suave y lo resalta 2 segundos; el botón atrás regresa al punto de salida */
async function exIr(d,sinHist){
  const X=S.ex;if(!X||!exPuedeIr(d))return;
  const t=String(d).split(':')[0],k=String(d).slice(t.length+1),sec=exDestSec(d);
  if(!sinHist){try{history.replaceState(Object.assign({},history.state,{y:window.scrollY}),'');history.pushState({ex:X.id,salto:1},'')}catch(e){}}
  X.ab[sec]=true;if(t==='q')X.resp=true;if(t==='sku'){X.conteo=true;X.cf='';X.cCrit=false}
  pintarTablero();
  if(t==='foto'&&!X.fotos&&X.M&&X.M.fotos.length)await accion_ex_fotos();
  if(t==='evi'){for(let i=0;i<40&&S.ex===X&&(!X.evUrl||X.evUrl[k]==null);i++)await sleep(75)}
  if(S.ex!==X)return;
  const c=window.CSS&&CSS.escape?CSS.escape(k):k.replace(/["\\]/g,'');
  const q={q:`#exs-hallazgos [data-q="${c}"]`,sku:`#exTabla [data-sku="${c}"]`,foto:`#exs-fotos [data-q="${c}"]`,evi:`#exs-fotos [data-evi="${c}"]`,msg:`#exs-avisos [data-aviso="${c}"]`}[t];
  const el=(q&&$(q))||$('#exs-'+sec);if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:q&&$(q)?'center':'start'});
  el.classList.add('exhi');setTimeout(()=>{el.classList.remove('exhi')},2000);
}
function tbVivoMapa(rows){
  const m={};(Array.isArray(rows)?rows:[]).forEach(x=>{if(!x||x.punto_id==null)return;const a=m[x.punto_id];
    const mejor=!a||((x.visita_estado==='en_curso')-(a.visita_estado==='en_curso'))>0||(((x.visita_estado==='en_curso')===(a.visita_estado==='en_curso'))&&(exT(x.ultima_actividad)||0)>(exT(a.ultima_actividad)||0));
    if(mejor)m[x.punto_id]=x});
  return m;
}
const tbVivo=r=>(S.tb.vivo&&r&&S.tb.vivo[r.punto_id])||null;
/* minutos sin movimiento de una visita en curso: se recalcula con la última actividad para que avance entre lecturas */
function tbQuieto(r){
  const v=tbVivo(r);if(!v||v.visita_estado!=='en_curso')return null;
  const t=exT(v.ultima_actividad);if(t!=null)return Math.max(0,Math.round((Date.now()-t)/60000));
  return tbNum(v.minutos_sin_movimiento);
}
const tbSinMov=r=>{if(TB_SIT[tbSit(r)][3]!==1)return false;const q=tbQuieto(r);return q!=null&&q>=TB_SINMOV_MIN};
/* semáforo de la bodega: verde terminada · amarillo en curso o de hoy · naranja incidencia (detenida, no se pudo auditar, sin conteo, sin movimiento) ·
   rojo sólo «sin registro» · gris por visitar · reprogramada como grupo aparte, que no cuenta como incidencia */
SEM.naranja={g:'▼',t:'Naranja',c:'inc'};SEM.gris={g:'○',t:'Gris',c:'plan'};SEM.repro={g:'↻',t:'Reprogramada',c:'rep'};
const TB_LUZ={rojo:0,naranja:1,amarillo:2,verde:3,gris:4,repro:5};
const TB_CUENTA=['verde','amarillo','naranja','rojo','repro','gris'];
const TB_LUZ_TXT={verde:['terminada','terminadas'],amarillo:['en curso','en curso'],naranja:['incidencia','incidencias'],rojo:['sin registro','sin registro'],repro:['reprogramada','reprogramadas'],gris:['por visitar','por visitar']};
function tbSemaforo(r){
  const s=tbSit(r);
  if(s==='terminada')return 'verde';
  if(s==='sin registro')return 'rojo';
  if(TB_SIT[s][3]===0||tbSinMov(r))return 'naranja';
  if(s==='en sitio'||s==='contando')return 'amarillo';
  if(s==='reprogramada')return 'repro';
  const f=dia10(r.fecha);return f&&f<=hoyMX()?'amarillo':'gris';
}
const tbGrupo=r=>TB_LUZ[tbSemaforo(r)];
const tbLuz=r=>{const k=tbSemaforo(r),x=SEM[k];return `<span class="sem luz ${x.c}" data-luz="${k}"><span aria-hidden="true">${x.g}</span> ${x.t}</span>`};
const tbEvid=r=>!!(S.tb.evid&&S.tb.evid.has(String(r.punto_id)));
const tbAvisos=r=>{const v=tbVivo(r);return v?(tbNum(v.avisos_abiertos)||0):0};
/* regla del cliente: el personal de cada día se confirma al menos 48 h antes de las 9:00 (hora del centro de México, UTC-6) del día de la visita, para poder bloquear la bodega */
const PLAZO_H=48,PLAZO_HORA=9;
/* «ahora»: en demo es la fecha de ejemplo con la hora real del reloj, para que los plazos tengan sentido */
const ahoraMX=()=>{if(datos&&datos.demo){const h=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour12:false});return Date.parse(HOY_DEMO+'T'+h+'-06:00')}return Date.now()};
const plazoLimite=f=>Date.parse(dia10(f)+'T'+String(PLAZO_HORA).padStart(2,'0')+':00:00-06:00')-PLAZO_H*3600000;
const plazoTxt=f=>{const iso=new Date(plazoLimite(f)).toISOString();return diaLabel(diaMX(iso))+' '+tbHora(iso)};
const faltaTxt=n=>n===1?'falta 1 persona':'faltan '+n+' personas';
/* estado del personal de un grupo de bodegas del mismo día: xs = [[asignadas, requeridas], ...] */
function plazoDia(f,xs){
  const req=xs.reduce((s,x)=>s+x[1],0),ok=xs.reduce((s,x)=>s+Math.min(x[0],x[1]),0),falta=req-ok,ms=plazoLimite(f)-ahoraMX();
  const h=Math.floor(ms/3600000),queda=h>=48?'quedan '+Math.floor(h/24)+' días':(h>=1?'quedan '+h+' h':'queda menos de 1 h');
  return {req,ok,falta,estado:!falta?'ok':(ms>0?'plazo':'vencido'),limite:plazoTxt(f),detalle:!falta?'completo':faltaTxt(falta)+', '+(ms>0?queda:'el plazo venció')};
}
const plazoChip=P=>`<span class="sem ${P.estado==='ok'?'ok':(P.estado==='plazo'?'wait':'miss')}"><span aria-hidden="true">${P.estado==='ok'?'●':(P.estado==='plazo'?'◆':'▲')}</span> Gente confirmada: ${P.ok} de ${P.req}</span>`;
const plazoHtml=P=>`<p class="plz" data-plazo="${P.estado}">${plazoChip(P)} <span>Límite: ${esc(P.limite)} · ${esc(P.detalle)}</span></p>`;
const tbAsig=r=>{const ps=tbPersonas(r.personas);return [ps?ps.length:(tbNum(r.asignadas)||0),tbNum(r.personas_req)||1]};
/* bodega futura: ¿ya tiene a toda su gente para que el cliente la bloquee? */
function tbPersonal(r){
  const f=dia10(r.fecha);if(!f||f<=hoyMX()||TB_SIT[tbSit(r)][3]!==3)return null;
  const [n,req]=tbAsig(r);return {ok:n>=req,falta:Math.max(0,req-n),limite:plazoTxt(f),vencido:plazoLimite(f)<=ahoraMX()};
}
const tbPersonalTxt=p=>p.ok?'Gente completa, lista para bloquear':'Falta gente: '+(p.falta===1?'1 persona':p.falta+' personas')+', límite '+p.limite+(p.vencido?' (ya venció)':'');
async function cargarTablero(manual){
  const T=S.tb;
  if(T.ocup||(!manual&&document.hidden&&T.rows))return;
  T.ocup=true;if(manual)pintarTablero();
  try{
    try{await cargarSku()}catch(e){if(e&&e.status===401)throw e}
    let rows,basico=false;
    try{rows=await datos.tableroCliente()}
    catch(e){if(e&&e.status===401)throw e;rows=await datos.calendarioCliente();basico=true}
    T.rows=Array.isArray(rows)?rows:[];T.basico=basico;T.en=new Date().toISOString();T.err='';
    try{T.vivo=tbVivoMapa(await datos.tableroVivo())}catch(e){if(e&&e.status===401)throw e;if(!T.vivo)T.vivo=null}
    if(!T.fichasNo){try{T.fichas=fichasMapa(await datos.fichas(YO.rol))}catch(e){if(e&&e.status===401)throw e;T.fichas=T.fichas||{};if(e&&(e.status===404||e.code==='PGRST202'||e.code==='42883'))T.fichasNo=true}}
    try{T.evid=new Set(((await datos.evidenciasResumen())||[]).map(x=>String(x.punto_id)))}catch(e){if(e&&e.status===401)throw e;if(!T.evid)T.evid=new Set()}
    if(T.dia===null){const ks=Array.from(new Set(T.rows.map(r=>dia10(r.fecha)).filter(Boolean))).sort(),h=hoyMX();T.dia=ks.includes(h)?h:(ks.find(d=>d>h)||'')}
  }catch(e){
    if(!T.rows){T.ocup=false;throw e}
    T.err='No se pudo actualizar. Se muestran los datos de las '+tbHora(T.en)+'.';
  }
  T.ocup=false;
  pintarTablero();
  if(T.lev===2)cargarCatalogo().catch(()=>{});
  if(puede('iwi','coordinador'))cargarAvisos().catch(()=>{});
  if(S.ex)cargarExpediente().catch(()=>{});
}
/* renglones de hechos de una bodega (HTML ya escapado); los comparten la tarjeta, el expediente de cliente y el reporte */
function tbLineas(r){
  const s=tbSit(r),g=TB_SIT[s][3],L=[];
  const ps=tbPersonas(r.personas),req=tbNum(r.personas_req)||0,n=ps?ps.length:tbNum(r.asignadas);
  const hecho=g===2||s==='sin conteo'||s==='no se pudo auditar';
  const quien=[];
  if(ps&&ps.length)quien.push(esc(tbLista(ps)));else if(n>0)quien.push(tbCuenta(n,'persona asignada','personas asignadas'));
  if(!hecho&&n!=null&&req>n)quien.push(`<b>${req-n===1?'falta 1 persona':'faltan '+(req-n)+' personas'}</b>`);
  if(quien.length)L.push(n>0?(hecho?'Fue: ':'Va: ')+quien.join(' · '):quien[0].replace('>f','>F'));
  if(s==='sin conteo')L.push('<b>Se cerró sin conteo</b>'+(r.fin_en?' a las '+esc(tbHora(r.fin_en)):''));
  if(r.llegada_en)L.push('Llegó '+esc(tbHora(r.llegada_en))+(r.llegada_ubicacion===true?', con ubicación':(r.llegada_ubicacion===false?', sin ubicación registrada':'')));
  else if(s==='sin registro')L.push('<b>No hay llegada registrada</b>'+(tbEvid(r)?', con evidencia externa':''));
  if(s==='en sitio')L.push('Aún no arranca el conteo');
  if(r.responsable)L.push('Recibió: '+esc(r.responsable));
  if(s==='contando'){if(r.inicio_en)L.push('Contando desde '+esc(tbHora(r.inicio_en)))}
  else if(s==='detenida'){if(r.inicio_en)L.push('Visita abierta desde '+esc(tbHora(r.inicio_en)))}
  else if(s==='terminada'&&r.inicio_en&&r.fin_en){const m=tbNum(r.minutos),mm=m!=null?m:(new Date(r.fin_en)-new Date(r.inicio_en))/60000;L.push('Conteo '+esc(tbHora(r.inicio_en))+' a '+esc(tbHora(r.fin_en))+(mm>0?', '+durTxt(mm):''))}
  const v=tbVivo(r);
  if(v&&v.visita_estado==='en_curso'&&(g===1||s==='detenida')){
    if(v.pantalla_actual)L.push('Va en: '+esc(exPantalla(v.pantalla_actual)));
    const t=exT(v.ultima_actividad);
    if(t!=null)L.push('Último movimiento '+esc(tbHora(v.ultima_actividad))+(diaMX(v.ultima_actividad)!==hoyMX()?' del '+esc(diaLabel(diaMX(v.ultima_actividad))):'')+', '+haceTxt(Date.now()-t));
  }
  const sk=tbNum(r.skus),fo=tbNum(r.fotos),ev=[];
  if(sk!=null&&(s==='terminada'||((s==='contando'||s==='detenida')&&sk>0)))ev.push(sk.toLocaleString('es-MX')+' SKU contados'+(s==='terminada'?'':' hasta ahora'));
  if(fo>0)ev.push(tbCuenta(fo,'foto','fotos'));
  if(ev.length)L.push(ev.join(' · '));
  const pe=tbPersonal(r);if(pe)L.push(pe.ok?esc(tbPersonalTxt(pe)):'<b>'+esc(tbPersonalTxt(pe))+'</b>');
  const av=tbAvisos(r);
  if(av>0)L.push(`<b>${av===1?'1 aviso de campo sin contestar':av+' avisos de campo sin contestar'}</b>`);
  const prog=dia10(r.fecha),real=dia10(r.fecha_real);
  if(real&&prog&&real!==prog)L.push('Se hizo el '+esc(diaLabel(real)));
  return L;
}
/* chip de estatus; la reprogramada no lo repite porque su semáforo ya dice «Reprogramada» */

/* explicación visible para el cliente y, si hubo corrección, quién la hizo y qué marcaba la app */

const tbCab=r=>{const lugar=[r.municipio,r.estado].filter(Boolean).join(', '),cab=[r.codigo,r.nombre_bodega].filter(Boolean).map(x=>esc(x));if(lugar)cab.push(cab.length?`<span class="lug">${esc(lugar)}</span>`:esc(lugar));return cab.join(' · ')||'Bodega'};
/* una sola línea para la tarjeta: qué pasó si hay explicación; si no, dónde va o el dato que define su estatus */
function tbUna(r){
  const s=tbSit(r),v=tbVivo(r),g=TB_SIT[s][3];
  if(r.explicacion)return esc(corta(r.explicacion,150));
  if(v&&v.visita_estado==='en_curso'&&(g===1||s==='detenida')){const t=exT(v.ultima_actividad);
    return [v.pantalla_actual?'Va en: '+esc(exPantalla(v.pantalla_actual)):'',t!=null?(Date.now()-t>=TB_SINMOV_MIN*60000?'sin moverse desde ':'último movimiento ')+esc(tbHora(v.ultima_actividad))+', '+haceTxt(Date.now()-t):''].filter(Boolean).join(' · ')}
  if(s==='terminada')return r.inicio_en&&r.fin_en?'Conteo '+esc(tbHora(r.inicio_en))+' a '+esc(tbHora(r.fin_en))+(tbNum(r.skus)!=null?' · '+tbNum(r.skus).toLocaleString('es-MX')+' SKU':''):'Conteo terminado';
  if(s==='sin conteo')return 'Se cerró sin conteo'+(r.fin_en?' a las '+esc(tbHora(r.fin_en)):'');
  if(s==='en sitio')return (r.llegada_en?'Llegó '+esc(tbHora(r.llegada_en))+', a':'A')+'ún no arranca el conteo';
  if(s==='contando')return r.inicio_en?'Contando desde '+esc(tbHora(r.inicio_en)):'Contando';
  if(s==='sin registro')return 'No hay llegada registrada'+(tbEvid(r)?', con evidencia externa':'');

function tbTarjeta(r){

async function accion_av_resp(id,enExp){
  const A=S.av,k='av:'+id,t=String(($(`[data-k="${k}"]`)||{}).value||'').trim();

  try{await datos.responderAviso(id,t);delete S.draft[k];aviso('Respuesta enviada.')}

/* estado de revisión para la lista: el calculado al abrir la bodega; si no se ha abierto, una estimación con lo que trae el tablero */
function tbRev(r){
  if(!YO||!exInterno()||tbSit(r)!=='terminada')return '';
  let e=S.rev&&S.rev[r.punto_id];
  if(!e){const sk=tbNum(r.skus),tot=S.sku&&S.sku.n;e=!sk||(tot&&sk<tot)?'Incompleta':'Falta revisar'}
  return ' '+revChip(e);
}

/* ===== las dos fichas de cada bodega: Campo (quien va) y Almacén (responsable de la bodega) =====
   El teléfono sólo lo ven iwi y coordinador; los demás roles ven lo que su lectura entrega (o «sin dato»). */
function fichasMapa(x){
  const m={};((x&&x.filas)||[]).forEach(f=>{if(!f||f.punto_id==null)return;let c=f.campo,a=f.almacen;
    if(typeof c==='string'){try{c=JSON.parse(c)}catch(e){c=[]}}if(typeof a==='string'){try{a=JSON.parse(a)}catch(e){a=null}}
    m[f.punto_id]={campo:Array.isArray(c)?c.filter(p=>p&&typeof p==='object'):[],almacen:a&&typeof a==='object'?a:null}});

async function evComprime(f){
  const url=URL.createObjectURL(f);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('imagen ilegible'));i.src=url});
    const m=Math.max(img.naturalWidth,img.naturalHeight)||1,k=Math.min(1,1600/m),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!b)throw new Error('imagen ilegible');return b}
  finally{URL.revokeObjectURL(url)}
}

async function accion_ex_corr(){

      if(r==='agencia'){const prev=(S.eq.find(x=>x.usuario===u)||{}).agencia||'';const n=(prompt('¿Cómo se llama la agencia de '+u+'?',prev)||'').trim();if(!n){aviso('Hace falta el nombre de la agencia.');return}S.eqMsg='';try{await datos.asignarAgenciaUsuario(u,n)}catch(err){const m=msgTope(err);if(m){S.eqMsg=m;pintarEquipo();aviso(m);return}throw err}delete S.draft['rol:'+u];aviso('Listo: '+u+' ahora tiene acceso como agencia «'+n+'».');await cargarEquipo();return}
      S.eqMsg='';await datos.asignarRol(u,r);aviso('Rol asignado: '+u+' ahora es '+r+'.');delete S.draft['rol:'+u];await cargarEquipo()}
  }catch(err){aviso('Error: '+err.message)}
});

  datos=crearDemo();YO={usuario:'demo',nombre:DEMO_NOMBRES[q],rol:q,agencia:null};

arrancar();
