<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>IAudit · App de campo (datos de ejemplo)</title>
<style>
:root{
  --bg:#f5f7f8; --surface:#ffffff; --sunk:#eaeff1; --line:#d3dce0;
  --ink:#14232b; --muted:#56666e;
  --agua:#0b6e85; --agua-soft:#dcedf1;
  --ok:#2e7d4f; --ok-soft:#e1f1e7;
  --warn:#a35a00; --warn-soft:#fbeedb;
  --bad:#b23a3a; --bad-soft:#f8e3e3;
  --demo:#6a4fa0; --demo-soft:#ece7f6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --surface:#16232a; --sunk:#1c2c34; --line:#2c3f48; --ink:#e4edf0; --muted:#98abb3;
  --agua:#4fb6cf; --agua-soft:#173a45; --ok:#6cc58f; --ok-soft:#183427; --warn:#e9a54a; --warn-soft:#3a2a12;
  --bad:#ec8080; --bad-soft:#3d1d1d; --demo:#b7a2e6; --demo-soft:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --surface:#16232a; --sunk:#1c2c34; --line:#2c3f48; --ink:#e4edf0; --muted:#98abb3;
  --agua:#4fb6cf; --agua-soft:#173a45; --ok:#6cc58f; --ok-soft:#183427; --warn:#e9a54a; --warn-soft:#3a2a12;
  --bad:#ec8080; --bad-soft:#3d1d1d; --demo:#b7a2e6; --demo-soft:#2a2340; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 4px}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-0.01em}
.brand h1 b{color:var(--agua)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.demo{background:var(--demo-soft);color:var(--demo)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)} .pill.agua{background:var(--agua-soft);color:var(--agua)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 11px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
nav.tabs button .n{font-family:var(--mono);font-size:11px;margin-right:6px;opacity:.75}
nav.tabs button[aria-selected="true"]{color:var(--agua);border-bottom-color:var(--agua)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
main{padding-block:22px 48px}
section.view{display:grid;gap:18px}
h2{font-size:24px;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h3{font-size:16px;margin:0}
p{margin:0}
.lead{font-size:16.5px;color:var(--muted);max-width:70ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--agua)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.note-demo,.note-val,.note-real{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:13.5px}
.note-demo{background:var(--demo-soft)} .note-demo b{color:var(--demo);flex:none}
.note-val{background:var(--warn-soft)} .note-val b{color:var(--warn);flex:none}
.note-real{background:var(--agua-soft)} .note-real b{color:var(--agua);flex:none}
button.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--agua);background:var(--agua);color:var(--surface);touch-action:manipulation}
button.btn.ghost{background:transparent;color:var(--agua)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--agua);border-color:var(--agua);color:var(--surface)}
.kpi{display:grid;gap:4px}
.kpi .v{font-size:26px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.kpi .d{font-size:12.5px;color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
th.sort{cursor:pointer} th.sort[aria-sort]::after{content:" ↓"} th.sort[aria-sort="ascending"]::after{content:" ↑"}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover{background:var(--sunk)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin:1px 2px 1px 0;white-space:nowrap}
.flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.ok{background:var(--ok-soft);color:var(--ok)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.pillar{background:var(--agua-soft);border-radius:10px;padding:14px;display:grid;gap:6px}
.pillar .k{font-family:var(--mono);font-size:12px;color:var(--agua)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.step .k{font-family:var(--mono);font-size:11.5px;color:var(--agua)}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--agua);flex:none}
.photo{display:grid;gap:8px}
.photo .ph{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px;background:var(--sunk);overflow:hidden}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.photo label.up{font-size:13px;color:var(--agua);font-weight:600;cursor:pointer}
.photo input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:96px;text-align:right;font-family:var(--mono)}
textarea{width:100%;min-height:84px;resize:vertical}
label.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.diff.ok{color:var(--ok)} .diff.warn{color:var(--warn)} .diff.bad{color:var(--bad)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--agua);border-radius:99px}
.saved{font-size:12.5px;color:var(--ok);min-height:1em}
.exportbox{font-family:var(--mono);font-size:12.5px;min-height:200px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--nar:#b8560a;--nar-soft:#fbe9d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nar:#f0a060;--nar-soft:#3a2412}}
:root[data-theme="dark"]{--nar:#f0a060;--nar-soft:#3a2412}
.pill.nar{background:var(--nar-soft);color:var(--nar)} .flag.nar{background:var(--nar-soft);color:var(--nar)}
.sem{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:999px;padding:6px 14px;font-size:15px}
.sem.r{background:var(--bad-soft);color:var(--bad)} .sem.n{background:var(--nar-soft);color:var(--nar)} .sem.a{background:var(--warn-soft);color:var(--warn)} .sem.v{background:var(--ok-soft);color:var(--ok)} .sem.x{background:var(--sunk);color:var(--muted)}
.wiz{max-width:640px;margin:0 auto;display:grid;gap:14px}
.prog{display:grid;gap:6px}
.prog .bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--agua);border-radius:99px;transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.qcard h3{font-size:20px;line-height:1.3}
.hint{font-size:14px;color:var(--muted)}
.kind{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--agua)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:17px;font-weight:600;min-height:56px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:manipulation;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--agua);background:var(--agua-soft);color:var(--agua)}
.opt.soft{font-size:14px;font-weight:500;min-height:44px;color:var(--muted)}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
button.big{font:inherit;font-size:17px;font-weight:700;min-height:56px;border-radius:12px;border:2px solid var(--agua);background:var(--agua);color:var(--surface);cursor:pointer;touch-action:manipulation}
button.big.ghost{background:transparent;color:var(--agua)}
button.big:disabled{opacity:.45;cursor:default}
.phbox{border:2px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--sunk)}
.phbox .want{font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.phbtn{display:inline-block;font-weight:700;color:var(--agua);border:2px solid var(--agua);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:center;min-height:48px}
.phbox input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.warmsg{background:var(--agua-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px}
.skurow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.skurow .nm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.skurow .nm b{font-family:var(--mono);font-size:13px}
.stp{display:grid;gap:2px;justify-items:center}
.stp label{font-size:11px;color:var(--muted)}
.stp input{width:68px;min-height:44px;font-size:17px;text-align:center}
.sigc{border:2px solid var(--line);border-radius:12px;background:#fff;width:100%;height:150px;touch-action:none}
.tbl-rows{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;background:var(--sunk);border-radius:10px;padding:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.hall{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.rolebar{display:flex;gap:6px;align-items:center}
.rolebar .chip{padding:4px 10px}
select.big{min-height:52px;font-size:17px;width:100%}
input.big,textarea.big{min-height:52px;font-size:17px;width:100%}
.tablebox table.mini td,.tablebox table.mini th{padding:6px 8px;font-size:13px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:480px){.opts.two{grid-template-columns:1fr}.nav2{grid-template-columns:1fr 1.4fr}}

/* ===== v7 · sistema de auditoría (reglas de Diseño): cuadros y líneas, esquinas de 2 px, azul casi blanco ===== */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --sunk:#F3F6FA; --line:#D3DDE8; --line2:#9DB0C6;
  --ink:#0B1F3A; --muted:#3F536B; --agua:#0B1F3A; --agua-soft:#EEF5FB; --acento:#0E8C99;
  --ok:#1F7A4D; --ok-soft:#E8F3ED; --warn:#9A7400; --warn-soft:#FBF4DF; --bad:#B3261E; --bad-soft:#F9E5E3;
  --demo:#3F536B; --demo-soft:#EEF5FB; --nar:#C2560E; --nar-soft:#FCECE2;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --r:2px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1A2E; --surface:#10243D; --sunk:#0E2138; --line:#1F3A5A; --line2:#2E5078; --ink:#EAF2F8; --muted:#B3C3D3;
  --agua:#EAF2F8; --agua-soft:#14405A; --acento:#5FD4DE; --ok:#4CC38A; --ok-soft:#123326; --warn:#E3B341; --warn-soft:#2E2814;
  --bad:#F2675E; --bad-soft:#351819; --demo:#B3C3D3; --demo-soft:#14405A; --nar:#F0883E; --nar-soft:#331F12}}
:root[data-theme="dark"]{
  --bg:#0B1A2E; --surface:#10243D; --sunk:#0E2138; --line:#1F3A5A; --line2:#2E5078; --ink:#EAF2F8; --muted:#B3C3D3;
  --agua:#EAF2F8; --agua-soft:#14405A; --acento:#5FD4DE; --ok:#4CC38A; --ok-soft:#123326; --warn:#E3B341; --warn-soft:#2E2814;
  --bad:#F2675E; --bad-soft:#351819; --demo:#B3C3D3; --demo-soft:#14405A; --nar:#F0883E; --nar-soft:#331F12}
body{font-size:15px;background:linear-gradient(rgba(11,31,58,.045) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(11,31,58,.045) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(180deg,#F8FAFD,var(--bg));background-attachment:fixed;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
:root[data-theme="dark"] body{background:var(--bg)}
/* nada boleado */
.card,.tablebox,.step,.pillar,.qcard,.phbox,.warmsg,.trow,.note-demo,.note-val,.note-real,.photo .ph,.thumbs img,.sigc,.opt,button.big,.phbtn,button.btn,.chip,.pill,.sem,.flag,input[type=number],input[type=text],select,textarea,.meter,.meter i,.prog .bar,.prog .bar i{border-radius:var(--r)!important}
/* encabezado y pestañas */
header.top{border-bottom:1px solid var(--line2)}
.brand h1{font-weight:300;font-size:20px;letter-spacing:-.02em}.brand h1 b{font-weight:600;color:var(--ink)}
nav.tabs button{border-bottom-width:2px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button .n{font-weight:400}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline-color:var(--acento)}
/* títulos: delgados con la palabra clave en negritas; escala contenida (base 15, máx. 22) */
h2{font-size:22px;font-weight:300;letter-spacing:-.02em}
h3{font-size:15px;font-weight:600}
.lead{font-size:15px}
.eyebrow,.kind,.kpi .d{letter-spacing:.14em;font-weight:600;font-size:11px;color:var(--muted);font-family:var(--mono)}
.qcard h3{font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.kpi .v{font-size:22px}
/* cajas con línea fina */
.card,.qcard,.step,.pillar,.tablebox,.trow,.phbox{border:1px solid var(--line2);background:var(--surface);box-shadow:none}
.pillar{background:var(--surface)}
.pillar .k,.step .k{color:var(--ink);font-weight:500}
.qcard{padding:18px}
th{background:var(--sunk);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
th,td{border-bottom:1px solid var(--line)}
/* etiquetas: caja de 2 px con borde del color, nunca globo; símbolo + color + etiqueta */
.pill,.sem,.flag{border:1px solid currentColor;font-weight:600;letter-spacing:.04em}
.pill{text-transform:uppercase;font-size:10.5px;padding:3px 7px}
.sem{padding:4px 10px;font-size:13px;gap:7px}
.sem::before{content:"";width:11px;height:11px;flex:none;background:currentColor}
.sem.v::before{border-radius:50%!important}
.sem.a::before{transform:rotate(45deg) scale(.82)}
.sem.n::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.sem.r::before{background:linear-gradient(45deg,transparent 42%,var(--surface) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--surface) 42% 58%,transparent 58%),currentColor}
.sem.x::before{border:1px solid currentColor;background:transparent}
.chip{font-size:12px;font-weight:600;border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
/* botones y respuestas */
button.btn,button.big{background:var(--ink);border:1px solid var(--ink);color:var(--surface)}
button.btn.ghost,button.big.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
button.big{min-height:56px;font-size:15px;font-weight:600;letter-spacing:.02em}
.opts{gap:0;border:1px solid var(--line2)}
.opt{border:0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500;text-align:left;min-height:52px;padding:0 14px;background:var(--surface)}
.opts .opt:last-child{border-bottom:0}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{border-bottom:0;border-right:1px solid var(--line);text-align:center}
.opts.two .opt:last-child{border-right:0}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.opt.soft{text-align:center;font-weight:500;color:var(--muted);text-decoration:underline;background:var(--sunk)}
.nav2{gap:0;border:1px solid var(--line2)}.nav2 button.big{border:0}.nav2 button.big.ghost{border-right:1px solid var(--line2)}
@media (max-width:480px){.opts.two{grid-template-columns:1fr 1fr}}
/* avance: línea de 4 px, no barra boleada */
.prog .bar{height:4px;background:var(--line)}.prog .bar i{background:var(--acento)}
/* evidencia */
.phbox{border:1px dashed var(--line2);background:var(--sunk);position:relative}
.phbtn{border:1px solid var(--acento);color:var(--acento);font-weight:600;min-height:48px}
.warmsg,.note-demo,.note-val,.note-real{border:1px solid var(--line);background:var(--agua-soft);color:var(--ink)}
.note-val{background:var(--warn-soft)}
.note-demo b,.note-val b,.note-real b{color:var(--ink)}
.sigc{border:1px solid var(--line2)}
input[type=number],input[type=text],select,textarea,input[type=date]{border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.check input{accent-color:var(--ink)}
.hall{border-bottom:1px solid var(--line)}
tr.click:hover{background:var(--agua-soft)}

/* ===== v8 · nube, ayudas y botón de dudas (solo se usa con window.IA_CONFIG) ===== */

      card:function(card,st){var key=keyOf(st),q=st.t==='q'?PQ[st.id]:null,txt=AYUDAS[key]||(q&&AYUDA_GEN[q.kind]);if(!txt)return;
        var k=card.querySelector('.kind'),h=card.querySelector('h3');if(!k||!h)return;
        k.classList.add('b8-kindrow');var b=el('button','b8-q','?');b.type='button';b.setAttribute('aria-label','Ayuda para esta pantalla');b.title='Ayuda';k.appendChild(b);
        var box=el('div','b8-ayuda');box.setAttribute('role','note');box.textContent=txt;box.hidden=!openHelp[key];b.setAttribute('aria-expanded',!box.hidden);
        h.parentNode.insertBefore(box,h.nextSibling);
        b.addEventListener('click',function(){box.hidden=!box.hidden;openHelp[key]=!box.hidden;b.setAttribute('aria-expanded',!box.hidden);if(!box.hidden)markAyuda()})},
      _test:{q:function(){return Q.slice()},ev:function(){return EV.slice()}}
    };
  })();

  // ---- Arranque ----
  if(B8){B8.hook.sync=pintaSync;
    B8.hook.fin=function(vid){var ch=false;Object.keys(visits).forEach(function(k){var v=visits[k];if(v&&v.vid===vid&&v.fin){if(!v.envOk){v.envOk=Date.now();ch=true}if(v.envV!==24){v.envV=24;ch=true}}});if(ch)saveV();pintaSync()};
    B8.hook.parc=function(vid,ts){var v=porVid(vid);if(v&&!(v.pOk>=ts)){v.pOk=ts;saveV()}};
    B8.listo.then(function(){setTimeout(recuperaCierres,1500)});B8.hook.rec=recuperaCierres}
  if(B8)B8.hook.duda=function(d){var v=V();if(v&&v.fin&&$('finest')){setTimeout(pintaSync,0);return true}return !!(v&&v.sa&&v.sa.activo&&v.sa.paso==='final'&&v.sa.did===d.id)};
  if(B8)B8.hook.auth=function(k){if(k==='out'){actual=null;MB=null;store.set('mb',null);modoSin=false;saveV();renderWiz()}else if(k==='in'){if(BLOQ||!V())renderWiz()}else if(!V())renderWiz()};
  renderWiz();
})();
</script>
</body></html>
