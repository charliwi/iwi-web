<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Obras · alkimia</title>
<meta name="description" content="Demo de alkimia para una constructora: tus obras juntas, lo que necesita tu atención y por qué. Datos de ejemplo.">
<!-- Orden 83 (14 nov): demo móvil para una constructora pequeña. Todo es inventado y va rotulado «datos de ejemplo».
     Regla «como Pulso»: tres recorridos clave, no la app completa. Ninguna compra se decide sólo por la fecha de cobro:
     toda recomendación de material queda sujeta al calendario real de la obra y a la validación del residente. -->
<style>
:root{--bg:#F0EEE6;--card:#FFFFFF;--ink:#191714;--ink2:#5E5850;--line:#DDD5C6;--acento:#D97757;--kraft:#D4A27F;--ok:#2E6B3F;--alerta:#B4462E;--aviso:#9A6A12;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--typ:"Courier Prime","Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191714;--card:#24211D;--ink:#F0EEE6;--ink2:#C2B9AC;--line:#3A352F;--acento:#E58A6B;--kraft:#B88A68;--ok:#7FC495;--alerta:#F08A72;--aviso:#E3B65A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191714;--card:#24211D;--ink:#F0EEE6;--ink2:#C2B9AC;--line:#3A352F;--acento:#E58A6B;--kraft:#B88A68;--ok:#7FC495;--alerta:#F08A72;--aviso:#E3B65A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
.banda{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px;background:var(--ink);color:var(--bg);font:400 12px/16px var(--typ);display:flex;justify-content:space-between;gap:8px}
.banda b{font:700 12px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase}
header{padding:24px 0 8px}
.marca{font:700 13px/24px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1{font:300 32px/36px var(--sans);letter-spacing:-.02em;margin:0 0 8px}h1 b{font-weight:700}
h2{font:700 13px/24px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:24px 0 8px}
p,.typ{font:400 15px/24px var(--typ);margin:0 0 12px}
a{color:inherit}
.volver{display:inline-block;font:600 14px/24px var(--sans);text-decoration:none;padding:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
a.card{display:block;text-decoration:none}
a.card:active{transform:scale(.99)}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.nombre{font:700 18px/24px var(--sans)}
.sub{font:400 13px/20px var(--typ);color:var(--ink2)}
.chip{display:inline-block;font:700 12px/20px var(--sans);padding:2px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.alerta{color:var(--alerta)}.chip.aviso{color:var(--aviso)}.chip.ok{color:var(--ok)}
.barra{position:relative;height:12px;border-radius:6px;background:var(--line);margin:12px 0 4px;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:6px}
.barra u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--acento);text-decoration:none}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font:400 12px/18px var(--typ);color:var(--ink2)}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.atn{border-left:4px solid var(--alerta)}.atn.aviso{border-left-color:var(--aviso)}.atn.ok{border-left-color:var(--ok)}
.atn .t{font:700 17px/24px var(--sans);margin:0 0 4px}
details summary{list-style:none;cursor:pointer;font:600 14px/24px var(--sans);color:var(--acento);margin-top:4px}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
.accion{background:var(--bg);border-radius:8px;padding:12px;margin-top:8px}
.accion b{font:700 13px/20px var(--sans);display:block;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.num{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.num .n{font:300 24px/32px var(--sans);font-variant-numeric:tabular-nums}.num .e{font:600 11px/16px var(--sans);color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font:400 14px/20px var(--sans)}
th{font:600 11px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gantt{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;align-items:center;font:400 13px/18px var(--sans)}
.gantt .pista{position:relative;height:16px;background:var(--bg);border-radius:4px}
.gantt .pista i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--kraft)}
.gantt .pista i.hecho{background:var(--ink)}
.gantt .pista em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--acento)}
svg text{font-family:var(--sans)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{font:600 12px/16px var(--sans);text-align:center;text-decoration:none;padding:8px 4px;border-radius:8px;color:var(--ink2)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.btn{display:block;width:100%;font:700 15px/24px var(--sans);padding:12px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.preg{display:block;width:100%;text-align:left;font:400 15px/22px var(--sans);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 8px;cursor:pointer}
.resp{font:400 15px/24px var(--typ);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.rango{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:0 0 16px}
.rango label{font:600 14px/20px var(--sans)}.rango output{font:700 16px/20px var(--sans);font-variant-numeric:tabular-nums}
.rango input{grid-column:1/-1;width:100%;accent-color:var(--acento)}
.rango small{grid-column:1/-1;font:400 12px/18px var(--typ);color:var(--ink2)}
.pasos{counter-reset:p;padding:0;margin:0;list-style:none}
.pasos li{counter-increment:p;position:relative;padding:0 0 12px 36px;font:400 15px/24px var(--typ)}
.pasos li::before{content:counter(p);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 13px/24px var(--sans);text-align:center}
.supuesto{font:400 13px/20px var(--typ);color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
body.reticula .app{background-image:linear-gradient(rgba(217,119,87,.18) 1px,transparent 1px);background-size:100% 24px}
</style>
<style id="vestido">
/* Vestido de Diseño (orden 83, 14 nov): para una persona que no es de pantallas. Letra más grande, toques grandes,
   «Hoy» con lo que necesita atención de todas las obras, y «Platícale» siempre a la mano. Sin cambiar textos, datos ni reglas. */
body{font:400 18px/27px var(--sans)}
.app{max-width:520px;padding:0 18px 170px}
.banda{margin:0 -18px;padding:9px 18px}
h1{font:300 38px/42px var(--sans);letter-spacing:-.03em;margin:4px 0 10px}
h2{font:700 14px/24px var(--sans);margin:30px 0 10px}
p,.typ{font:400 17px/27px var(--typ)}
.sub{font:400 15px/22px var(--typ)}
.marca{font:700 14px/24px var(--sans)}
.card{border-radius:14px;padding:18px;border-color:transparent;box-shadow:0 1px 0 rgba(25,23,20,.06)}
.nombre{font:700 21px/27px var(--sans)}
.chip{font:700 14px/22px var(--sans);padding:3px 12px}
.barra{height:14px;border-radius:7px}
.leyenda{font:400 14px/20px var(--typ)}
.atn{border-left-width:6px}
.atn .t{font:700 21px/27px var(--sans)}
details summary{font:700 17px/24px var(--sans);display:inline-block;margin-top:10px;padding:10px 16px;border-radius:999px;background:var(--bg);color:var(--ink)}
details summary::after{content:" →"}details[open] summary::after{content:" ↓"}
.accion{padding:14px;font:400 17px/26px var(--sans)}
.num .n{font:300 28px/36px var(--sans)}.num .e{font:700 12px/16px var(--sans)}
.volver{font:700 17px/24px var(--sans);padding:16px 0 6px}
.gantt{grid-template-columns:110px 1fr;font:400 15px/20px var(--sans)}
.gantt .pista{height:18px}
.preg{font:600 17px/24px var(--sans);padding:15px 14px;border-radius:12px}
.resp{font:400 17px/27px var(--typ);padding:14px}
.btn{font:700 17px/24px var(--sans);padding:15px 16px;border-radius:12px}
.rango label{font:700 16px/22px var(--sans)}
nav.tabs{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs div{max-width:520px;grid-template-columns:repeat(5,1fr)}
nav.tabs a{font:700 14px/18px var(--sans);padding:11px 2px;border-radius:10px}
.platicale{position:fixed;right:max(14px,calc(50% - 246px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:999px;background:var(--ink);color:var(--bg);font:700 16px/1 var(--sans);padding:8px 16px 8px 8px;box-shadow:0 8px 20px rgba(25,23,20,.25)}
.platicale .orb{width:28px;height:28px;border-radius:50%;background:conic-gradient(#8C5ADC,#FF46AA,#FF6E28,#FFBE3C,#1EDC78,#2878FF,#8C5ADC);animation:gira 6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.platicale[hidden]{display:none}
.platicale{transition:opacity .25s,transform .25s}.platicale.fuera{opacity:0;transform:translateY(16px);pointer-events:none}
#vista svg text{font-size:14px}
@media (prefers-reduced-motion:reduce){.platicale .orb{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="banda"><b>Datos de ejemplo</b><span>Obras y cifras inventadas</span></div>
  <main id="vista"></main>
</div>
<a class="platicale" id="platicale" href="#pregunta"><span class="orb" aria-hidden="true"></span><span>Platícale<small style="display:block;font:400 12px/14px var(--typ);opacity:.75;margin-top:3px">simulado</small></span></a>
<nav class="tabs" aria-label="Secciones"><div>
  <a href="#hoy">Hoy</a><a href="#obras">Obras</a><a href="#pregunta">Pregunta</a><a href="#capacidad">Capacidad</a><a href="#panorama">Panorama</a>
</div></nav>
<script>
/* ---------- Datos de ejemplo (todo inventado; montos en millones de pesos, redondeados) ---------- */
const HOY = 18; // semana del programa en la que «estamos» para el edificio; cada obra trae la suya
const OBRAS = [
  { id: "edificio", nombre: "Edificio de 8 departamentos", lugar: "Zona norte · 4 niveles · 1,120 m²", semana: 18, duracion: 40,
    prog: 47, real: 41, contrato: 18.4, cobrado: 7.1, estado: "alerta", resumen: "Va atrás del programa y la semana 22 el saldo queda en rojo si no se confirma un cobro.",
    etapas: [["Cimentación", 1, 8, 100], ["Estructura", 7, 22, 62], ["Muros", 16, 28, 8], ["Instalaciones", 18, 32, 0], ["Acabados", 26, 38, 0], ["Entrega", 38, 40, 0]],
    flujo: { saldo0: 2.4, semanas: [18, 19, 20, 21, 22, 23, 24, 25],
      sale: [0.55, 0.60, 0.95, 1.10, 0.70, 0.60, 0.55, 0.55], entraConf: [0.90, 0, 0, 0, 0, 1.90, 0, 1.50], entraPend: [0, 0, 0, 0, 1.40, 0, 0, 0] },
    materiales: [
      ["Varilla para el nivel 3", "comprometido", "Llega semana 20; el colado del nivel 3 depende de ella."],
      ["Concreto premezclado nivel 3", "comprometido", "Programado para semana 21."],
      ["Block para muros nivel 1 y 2", "por pedir", "Se necesita en semana 22; el proveedor tarda dos semanas."],
      ["Tubería hidráulica y sanitaria", "por pedir", "Se necesita en semana 24."],
      ["Cimbra (renta)", "en obra", "Dos juegos; el tercero aceleraría la estructura."],
      ["Acero de refuerzo nivel 2", "en obra", "Sobrante para remates."] ],
    atencion: [
      { nivel: "alerta", t: "La estructura va dos semanas atrás", por: "El programa pedía 47 % de avance a la semana 18 y llevamos 41 %. El retraso viene del nivel 3: se usan dos juegos de cimbra y cada losa espera a que se libere la anterior.",
        accion: "Revisar con el residente si conviene rentar un tercer juego de cimbra por cuatro semanas. Comparar ese costo contra dos semanas más de obra y contra el cobro que depende de terminar la estructura.", ver: "calendario" },
      { nivel: "aviso", t: "La semana 22 el saldo queda en rojo", por: "Entre las semanas 20 y 21 se pagan varilla y concreto del nivel 3. Contando sólo lo confirmado, el saldo llega casi a cero en la semana 21 y queda en rojo en la 22. La estimación 5 ya está entregada pero el cliente no ha confirmado la fecha de pago; si se paga en la semana 22 como se espera, el saldo no baja de cero.",
        accion: "Confirmar esta semana con el cliente la fecha de pago de la estimación 5. La varilla y el concreto no se mueven: el colado depende de ellos. Si el pago se retrasa, ver con el proveedor un plazo de pago, no un cambio de fecha de entrega.", ver: "flujo" },
      { nivel: "aviso", t: "Falta pedir el block de muros", por: "Los muros arrancan en la semana 22 según el calendario y el proveedor entrega en dos semanas. Si no se pide en la semana 19, la cuadrilla de muros se queda parada.",
        accion: "Pedir el block esta semana, con cantidades validadas por el residente contra planos. Se puede pedir en dos entregas si el calendario de muros lo permite.", ver: "materiales" } ] },
  { id: "casa", nombre: "Casa de 280 m²", lugar: "Fraccionamiento al poniente · 2 niveles", semana: 22, duracion: 30,
    prog: 72, real: 74, contrato: 6.2, cobrado: 4.3, estado: "ok", resumen: "Va al día. Lo próximo: acabados y la estimación 6.",
    etapas: [["Cimentación", 1, 5, 100], ["Estructura", 4, 13, 100], ["Muros", 10, 18, 100], ["Instalaciones", 14, 24, 85], ["Acabados", 20, 29, 35], ["Entrega", 29, 30, 0]],
    flujo: { saldo0: 1.0, semanas: [22, 23, 24, 25, 26, 27, 28, 29],
      sale: [0.30, 0.35, 0.40, 0.30, 0.25, 0.30, 0.20, 0.15], entraConf: [0, 0.75, 0, 0, 0.70, 0, 0, 0], entraPend: [0, 0, 0, 0, 0, 0, 0, 0.75] },
    materiales: [
      ["Piso cerámico", "comprometido", "Llega semana 24."], ["Cancelería de aluminio", "comprometido", "Medición hecha; instalación semana 27."],
      ["Muebles de baño", "por pedir", "Se necesitan en semana 26; el cliente elige modelo esta semana."], ["Pintura", "en obra", "Primera mano lista."] ],
    atencion: [
      { nivel: "ok", t: "Va al día", por: "74 % de avance contra 72 % programado. Instalaciones casi listas.", accion: "Nada urgente. Lo único: que el cliente elija los muebles de baño esta semana para pedirlos a tiempo.", ver: "materiales" } ] },
  { id: "local", nombre: "Remodelación de local comercial", lugar: "Centro · planta baja · 90 m²", semana: 3, duracion: 10,
    prog: 25, real: 20, contrato: 1.1, cobrado: 0.33, estado: "aviso", resumen: "Arranque lento por un permiso; se recupera si entra la segunda cuadrilla.",
    etapas: [["Demolición", 1, 2, 100], ["Instalaciones", 2, 5, 20], ["Muros y plafón", 4, 7, 0], ["Acabados", 6, 9, 0], ["Entrega", 9, 10, 0]],
    flujo: { saldo0: 0.45, semanas: [3, 4, 5, 6, 7, 8, 9, 10], sale: [0.10, 0.12, 0.12, 0.10, 0.10, 0.08, 0.06, 0.04], entraConf: [0, 0, 0.33, 0, 0, 0, 0, 0], entraPend: [0, 0, 0, 0, 0, 0.22, 0, 0.22] },
    materiales: [["Cableado y centros de carga", "comprometido", "Llega semana 4."], ["Tablaroca y perfiles", "por pedir", "Se necesitan en semana 5."], ["Escombro (retiro)", "en obra", "Pendiente un viaje."]],
    atencion: [
      { nivel: "aviso", t: "Una semana atrás por el permiso", por: "El permiso de la plaza llegó una semana tarde y las instalaciones arrancaron después.", accion: "Revisar con el residente si una segunda cuadrilla dos semanas recupera la fecha de entrega, y si el cliente acepta ese costo o prefiere mover la entrega.", ver: "calendario" } ] },
];
const PREGUNTAS = [
  ["¿Qué obra me necesita hoy?", "El edificio. Va 6 puntos atrás del programa por la cimbra del nivel 3, y contando sólo lo confirmado la semana 22 el saldo queda en rojo hasta que se confirme el pago de la estimación 5. Las otras dos van bien o con un retraso que se puede recuperar."],
  ["¿Me conviene acelerar el edificio?", "Depende de dos cosas: cuánto cuesta el tercer juego de cimbra y si el cliente confirma la estimación 5. La pantalla del edificio te pone las dos lado a lado con el calendario; la decisión es tuya y de tu residente."],
  ["¿Qué tengo que pedir esta semana?", "El block de muros del edificio (se necesita en la semana 22, el proveedor tarda dos) y, en la casa, que el cliente elija muebles de baño. Las cantidades las valida el residente."],
  ["¿Cuánto me falta por cobrar?", "Con los datos de ejemplo: 11.3 millones en el edificio, 1.9 en la casa y 0.77 en el local. De eso, lo confirmado para las próximas ocho semanas son 6.1 millones."],
];
const fmt = (n) => n.toLocaleString("es-MX", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ESTADO = { alerta: ["Necesita tu atención", "alerta"], aviso: ["Revisar esta semana", "aviso"], ok: ["Va al día", "ok"] };
const $ = (s) => document.querySelector(s);

/* ---------- Vistas ---------- */
function obras() {
  return `<header><div class="marca">alkimia · constructora de ejemplo</div><h1>Tus <b>obras</b>, juntas.</h1>
    <p>Lo que tu equipo ya tiene en la oficina y en Drive, en un solo lugar. Toca una obra y te explica qué necesita tu atención y por qué.</p></header>
    ${OBRAS.map((o) => `<a class="card" href="#obra-${o.id}">
      <div class="fila"><span class="nombre">${esc(o.nombre)}</span><span class="chip ${ESTADO[o.estado][1]}">${ESTADO[o.estado][0]}</span></div>
      <div class="sub">${esc(o.lugar)} · semana ${o.semana} de ${o.duracion}</div>
      <div class="barra" aria-label="Avance real ${o.real} %, programado ${o.prog} %"><i style="width:${o.real}%"></i><u style="left:${o.prog}%"></u></div>
      <div class="leyenda"><span style="--c:var(--ink)">Avance ${o.real} %</span><span style="--c:var(--acento)">Programa ${o.prog} %</span></div>
      <p style="margin:8px 0 0">${esc(o.resumen)}</p></a>`).join("")}
    <h2>Tres recorridos para probar</h2>
    <div class="card"><ol class="pasos">
      <li><a href="#obra-edificio">Abre el edificio</a> y lee las tres cosas que necesitan tu atención: por qué y qué se propone.</li>
      <li>En el mismo edificio, mira <a href="#obra-edificio/flujo">el flujo</a>: lo que sale, lo que ya está confirmado que entra y lo que falta confirmar. Ahí decides si aceleras o frenas.</li>
      <li>Pasa a <a href="#capacidad">Capacidad</a>: mueve tu equipo y tu capital y mira cuántas obras podrías llevar a la vez y qué te detiene.</li>
    </ol></div>
    <p class="sub">Las recomendaciones de compra siempre van sujetas al calendario real de la obra y a la validación del residente. Nada se pospone sólo porque el cobro llega después.</p>`;
}

function barraGantt(o) {
  const max = o.duracion;
  return `<div class="gantt">${o.etapas.map(([n, a, b, h]) => `<span>${esc(n)}</span><div class="pista" title="Semanas ${a} a ${b} · ${h} % hecho">
    <i style="left:${(a - 1) / max * 100}%;width:${(b - a + 1) / max * 100}%"></i>
    <i class="hecho" style="left:${(a - 1) / max * 100}%;width:${(b - a + 1) / max * 100 * h / 100}%"></i>
    <em style="left:${o.semana / max * 100}%"></em></div>`).join("")}</div>
    <div class="leyenda" style="margin-top:8px"><span style="--c:var(--ink)">Hecho</span><span style="--c:var(--kraft)">Por hacer</span><span style="--c:var(--acento)">Hoy: semana ${o.semana}</span></div>`;
}

function grafFlujo(o) {
  const f = o.flujo, n = f.semanas.length, W = 440, H = 220, pad = 28, bw = (W - pad * 2) / n;
  let saldo = f.saldo0; const saldos = f.semanas.map((_, i) => (saldo += f.entraConf[i] - f.sale[i]));
  const maxV = Math.max(...f.sale, ...f.entraConf.map((x, i) => x + f.entraPend[i]), ...saldos.map(Math.abs), 1);
  const y = (v) => H / 2 - (v / maxV) * (H / 2 - 20);
  const barras = f.semanas.map((s, i) => {
    const x = pad + i * bw;
    return `<rect x="${x + 4}" y="${y(f.entraConf[i])}" width="${bw / 2 - 6}" height="${y(0) - y(f.entraConf[i])}" fill="var(--ok)"/>
      <rect x="${x + 4}" y="${y(f.entraConf[i] + f.entraPend[i])}" width="${bw / 2 - 6}" height="${y(f.entraConf[i]) - y(f.entraConf[i] + f.entraPend[i])}" fill="none" stroke="var(--ok)" stroke-dasharray="3 3"/>
      <rect x="${x + bw / 2}" y="${y(0)}" width="${bw / 2 - 6}" height="${y(-f.sale[i]) - y(0)}" fill="var(--alerta)"/>
      <text x="${x + bw / 2}" y="${H - 4}" font-size="11" text-anchor="middle" fill="var(--ink2)">s${s}</text>`;
  }).join("");
  const linea = saldos.map((v, i) => `${pad + i * bw + bw / 2},${y(v)}`).join(" ");
  const minI = saldos.indexOf(Math.min(...saldos));
  return { svg: `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Flujo semanal de ejemplo">
    <line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${barras}
    <polyline points="${linea}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
    ${saldos.map((v, i) => `<circle cx="${pad + i * bw + bw / 2}" cy="${y(v)}" r="${i === minI ? 5 : 3}" fill="${i === minI ? "var(--acento)" : "var(--ink)"}"/>`).join("")}
    </svg>`, saldos, minI };
}

function obra(id, seccion) {
  const o = OBRAS.find((x) => x.id === id); if (!o) return obras();
  const g = grafFlujo(o), f = o.flujo;
  const mat = (estado) => o.materiales.filter((m) => m[1] === estado);
  const porCobrar = o.contrato - o.cobrado;
  setTimeout(() => { if (seccion) document.getElementById(seccion)?.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
  return `<a class="volver" href="#obras">← Todas las obras</a>
    <header style="padding-top:0"><div class="marca">${esc(o.lugar)}</div><h1>${esc(o.nombre)}</h1>
      <span class="chip ${ESTADO[o.estado][1]}">${ESTADO[o.estado][0]}</span></header>
    <div class="nums"><div class="num"><div class="e">Avance</div><div class="n">${o.real} %</div><div class="sub">programa ${o.prog} %</div></div>
      <div class="num"><div class="e">Semana</div><div class="n">${o.semana}</div><div class="sub">de ${o.duracion}</div></div>
      <div class="num"><div class="e">Por cobrar</div><div class="n">${fmt(porCobrar)}</div><div class="sub">millones</div></div></div>

    <h2>Esto necesita tu atención</h2>
    ${o.atencion.map((a) => `<div class="card atn ${a.nivel}"><div class="t">${esc(a.t)}</div>
      <details><summary>¿Por qué?</summary><p>${esc(a.por)}</p>
      <div class="accion"><b>Acción propuesta</b>${esc(a.accion)}</div>
      <p class="sub" style="margin:8px 0 0"><a href="#obra-${o.id}/${a.ver}">Ver ${a.ver === "flujo" ? "el flujo" : a.ver === "materiales" ? "los materiales" : "el calendario"} →</a></p></details></div>`).join("")}

    <h2 id="calendario">Avance y calendario</h2>
    <div class="card">${barraGantt(o)}</div>

    <h2 id="flujo">Flujo: lo que sale y lo que entra</h2>
    <div class="card">${g.svg}
      <div class="leyenda"><span style="--c:var(--ok)">Cobro confirmado</span><span style="--c:transparent;outline:1px dashed var(--ok)">Por confirmar</span><span style="--c:var(--alerta)">Pagos previstos</span><span style="--c:var(--ink)">Saldo</span></div>
      <p style="margin-top:12px">El punto más bajo es la semana ${f.semanas[g.minI]}, con ${fmt(g.saldos[g.minI])} millones de saldo contando sólo lo confirmado. Si entra lo que falta confirmar, el saldo de cierre sería ${fmt(g.saldos.at(-1) + f.entraPend.reduce((a, b) => a + b, 0))} millones.</p>
      <div class="supuesto">Supuestos de ejemplo: saldo inicial de ${fmt(f.saldo0)} millones; pagos según el programa de compras y la nómina semanal; los cobros «por confirmar» son estimaciones entregadas sin fecha de pago firmada.</div></div>

    <h2 id="materiales">Materiales</h2>
    <div class="card"><table><thead><tr><th>Material</th><th>Estado</th></tr></thead><tbody>
      ${["por pedir", "comprometido", "en obra"].flatMap((e) => mat(e).map((m) => `<tr><td><b>${esc(m[0])}</b><div class="sub">${esc(m[2])}</div></td><td><span class="chip ${e === "por pedir" ? "aviso" : e === "comprometido" ? "" : "ok"}">${e}</span></td></tr>`)).join("")}
    </tbody></table>
    <div class="supuesto">Lo que se pide sale del calendario de la obra y lo valida el residente contra planos. El flujo ayuda a negociar plazos de pago, no a mover materiales indispensables.</div></div>`;
}

function pregunta() {
  return `<header><div class="marca">Plática simulada</div><h1>Pregúntale a tus <b>obras</b>.</h1>
    <p>Así respondería alkimia con tus datos. Aquí las respuestas están escritas de antemano con los datos de ejemplo: es una muestra, no una conversación real.</p></header>
    ${PREGUNTAS.map(([q, r], i) => `<button class="preg" data-i="${i}">${esc(q)}</button><div class="resp" id="r${i}" hidden>${esc(r)}</div>`).join("")}`;
}

function capacidad() {
  return `<header><div class="marca">Proyección · escenarios</div><h1>¿Cuántas obras <b>podrías llevar</b>?</h1>
    <p>No promete productividad: con los supuestos que muevas, dice cuántas obras a la vez aguanta tu equipo, tu capital y tu oficina, y cuál de los tres te detiene primero.</p></header>
    <div class="card">
      <div class="rango"><label for="c-res">Residentes de obra</label><output id="o-res"></output><input id="c-res" type="range" min="1" max="6" value="2"><small>Supuesto: cada residente lleva bien hasta 2 obras medianas a la vez.</small></div>
      <div class="rango"><label for="c-cap">Capital de trabajo (millones)</label><output id="o-cap"></output><input id="c-cap" type="range" min="0.5" max="8" step="0.5" value="2.5"><small>Supuesto: una obra mediana llega a necesitar 0.9 millones propios en su peor semana, antes de cobrar.</small></div>
      <div class="rango"><label for="c-ofi">Personas en oficina (compras y cobranza)</label><output id="o-ofi"></output><input id="c-ofi" type="range" min="1" max="5" value="2"><small>Supuesto: cada persona de oficina sigue compras y cobros de hasta 2.5 obras.</small></div>
    </div>
    <div class="card" id="cap-res" aria-live="polite"></div>
    <h2>Tres escenarios</h2>
    <div class="card" id="cap-esc"></div>
    <p class="sub">Todo es de ejemplo. Con tus datos reales, los supuestos salen de tus obras pasadas y los revisas tú antes de usarlos.</p>`;
}
function calcCap(res, cap, ofi) {
  const porRes = res * 2, porCap = Math.floor(cap / 0.9), porOfi = Math.floor(ofi * 2.5);
  const n = Math.min(porRes, porCap, porOfi);
  const freno = n === porCap ? "el capital" : n === porRes ? "los residentes" : "la oficina";
  return { porRes, porCap, porOfi, n, freno };
}
function pintaCap() {
  const res = +$("#c-res").value, cap = +$("#c-cap").value, ofi = +$("#c-ofi").value;
  $("#o-res").textContent = res; $("#o-cap").textContent = fmt(cap); $("#o-ofi").textContent = ofi;
  const c = calcCap(res, cap, ofi);
  $("#cap-res").innerHTML = `<div class="fila"><span class="nombre">Hasta ${c.n} obras a la vez</span><span class="chip aviso">Te detiene ${c.freno}</span></div>
    <table style="margin-top:8px"><tbody><tr><td>Por residentes</td><td class="n">${c.porRes}</td></tr><tr><td>Por capital</td><td class="n">${c.porCap}</td></tr><tr><td>Por oficina</td><td class="n">${c.porOfi}</td></tr></tbody></table>`;
  const E = [["Hoy (ejemplo)", 2, 2.5, 2], ["Un residente más", 3, 2.5, 2], ["Más capital", 2, 4.5, 2]];
  $("#cap-esc").innerHTML = `<table><thead><tr><th>Escenario</th><th class="n">Obras</th><th>Freno</th></tr></thead><tbody>${E.map(([t, r, k, o]) => { const x = calcCap(r, k, o); return `<tr><td>${t}<div class="sub">${r} residentes · ${fmt(k)} millones · ${o} en oficina</div></td><td class="n">${x.n}</td><td>${x.freno}</td></tr>`; }).join("")}</tbody></table>
    <p style="margin:8px 0 0">Con estos supuestos, sumar un residente no cambia nada si el capital no alcanza: primero se resuelve lo que frena.</p>`;
}

function panorama() {
  /* Datos de Mía (orden 83, 14 nov), verificados por Kim en el extracto de los boletines oficiales (no en el PDF completo); cifras preliminares. */
  const DATOS = [
    ["La construcción creció 10.6 % anual.", "Agosto de 2026 · nacional · serie desestacionalizada", "INEGI, Encuesta Nacional de Empresas Constructoras, boletín 636/26"],
    ["Entre los estados destaca Querétaro: +57.9 % anual en junio, y +26.1 % en su construcción en julio.", "Junio y julio de 2026 · Querétaro", "INEGI, ENEC boletín 502/26 e IMAIEF boletín 687/26"],
    ["La vivienda con crédito subió 7 % anual; de enero a septiembre, 10.1 % en Guadalajara, 8.9 % en Tijuana y 4.6 % en el Valle de México.", "Tercer trimestre de 2026 · nacional y zonas metropolitanas", "SHF, Índice de Precios de la Vivienda, 10 nov 2026"],
    ["Construir cuesta más: precios al productor de la construcción +6.23 % anual.", "Octubre de 2026 · nacional · preliminar", "INEGI, Índice Nacional de Precios Productor, boletín 685/26"],
  ];
  return `<header><div class="marca">Panorama · México</div><h1>Para dónde va <b>la onda</b>.</h1>
    <p>Datos oficiales leídos en el extracto de cada boletín; son cifras preliminares y pueden revisarse. Antes de decidir con ellos, conviene abrir el boletín completo.</p></header>
    ${DATOS.map(([d, cuando, fuente]) => `<div class="card"><div class="fila"><span class="nombre" style="font-size:17px">${esc(d)}</span></div>
      <div class="sub" style="margin-top:6px">${esc(cuando)} · ${esc(fuente)}</div><span class="chip aviso" style="margin-top:8px">preliminar</span></div>`).join("")}
    <h2>Hipótesis, no hecho</h2>
    <div class="card"><p style="margin:0">Buena parte del crecimiento de 2026 parece venir de obra pública. Eso no significa más mercado para la obra chica privada.</p></div>
    <h2>Sobre los terrenos</h2>
    <div class="card"><p>No hay un dato público comparable del precio del terreno por metro cuadrado entre ciudades. Y el precio solo no basta: cuentan los servicios, el uso de suelo, la demanda, qué tan rápido se vende y los papeles del predio.</p>
      <p style="margin:0"><b>¿Qué ciudades estás considerando?</b> Con eso buscamos terrenos zona por zona.</p></div>`;
}

/* «Hoy» (Diseño): lo que necesita atención de todas las obras, primero lo más urgente */
function hoy() {
  const orden = { alerta: 0, aviso: 1, ok: 2 };
  const todas = OBRAS.flatMap((o) => o.atencion.map((a) => ({ ...a, o }))).sort((x, y) => orden[x.nivel] - orden[y.nivel]);
  const n = todas.filter((a) => a.nivel !== "ok").length;
  const cuantas = ["Nada urgente hoy.", "Una cosa necesita tu atención.", "Dos cosas necesitan tu atención.", "Tres cosas necesitan tu atención.", "Cuatro cosas necesitan tu atención.", "Cinco cosas necesitan tu atención."][Math.min(n, 5)];
  return `<header><div class="marca">alkimia · constructora de ejemplo</div><h1>Buenos días. <b>${cuantas}</b></h1>
    <p>De todas tus obras, en orden. Toca «¿Por qué?» y te explica.</p></header>
    ${todas.map((a) => `<div class="card atn ${a.nivel}"><div class="sub" style="margin-bottom:4px"><b>${esc(a.o.nombre)}</b></div><div class="t">${esc(a.t)}</div>
      <details><summary>¿Por qué?</summary><p>${esc(a.por)}</p>
      <div class="accion"><b>Acción propuesta</b>${esc(a.accion)}</div>
      <p class="sub" style="margin:8px 0 0"><a href="#obra-${a.o.id}/${a.ver}">Ver ${a.ver === "flujo" ? "el flujo" : a.ver === "materiales" ? "los materiales" : "el calendario"} →</a></p></details></div>`).join("")}
    <h2>Tus obras</h2>
    ${OBRAS.map((o) => `<a class="card" href="#obra-${o.id}"><div class="fila"><span class="nombre">${esc(o.nombre)}</span><span class="chip ${ESTADO[o.estado][1]}">${ESTADO[o.estado][0]}</span></div>
      <div class="barra" aria-label="Avance real ${o.real} %, programado ${o.prog} %"><i style="width:${o.real}%"></i><u style="left:${o.prog}%"></u></div>
      <div class="leyenda"><span style="--c:var(--ink)">Avance ${o.real} %</span><span style="--c:var(--acento)">Programa ${o.prog} %</span></div></a>`).join("")}`;
}

/* ---------- Ruteo ---------- */
function vista() {
  const h = location.hash.slice(1) || "hoy";
  const [base, sec] = h.split("/");
  let html, tab = base;
  if (base.startsWith("obra-")) { html = obra(base.slice(5), sec); tab = "obras"; }
  else html = { hoy, obras, pregunta, capacidad, panorama }[base]?.() ?? hoy();
  { const pb = document.getElementById("platicale"); if (pb) pb.hidden = base === "pregunta"; }
  $("#vista").innerHTML = html;
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + tab ? "page" : "false"));
  if (base === "capacidad") { ["#c-res", "#c-cap", "#c-ofi"].forEach((s) => ($(s).oninput = pintaCap)); pintaCap(); }
  if (base === "pregunta") document.querySelectorAll(".preg").forEach((b) => (b.onclick = () => { const r = $("#r" + b.dataset.i); r.hidden = !r.hidden; }));
  if (!sec) scrollTo(0, 0);
}
addEventListener("hashchange", vista);
/* Diseño: «Platícale» se esconde mientras bajas y vuelve al subir o al detenerte, para no tapar tarjetas */
(function () { let y0 = scrollY, t = null; const b = document.getElementById("platicale"); if (!b) return;
  addEventListener("scroll", () => { const y = scrollY; if (y > y0 + 4 && y > 80) b.classList.add("fuera"); else if (y < y0 - 4) b.classList.remove("fuera"); y0 = y;
    clearTimeout(t); t = setTimeout(() => b.classList.remove("fuera"), 900); }, { passive: true }); })();
document.addEventListener("keydown", (e) => { if (e.key === "g" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) document.body.classList.toggle("reticula"); });
vista();
</script>
