<style>
/* Demo móvil de obras (orden 83, dueña alkimia; interfaz de Diseño, 14 nov 2026).
   Carlos: «algo súper navegable, súper intuitivo y sencillo de observar… esto es lo que necesita tu atención».
   Para una persona que no es de pantallas: letra grande, una idea por pantalla, tocar y que le explique.
   Base: DISENO-BASE (Helvetica 700 contra 300, Courier Prime para lo que explica). Datos de ejemplo en <script id="datos">. */
:root{--bg:#F0EEE6;--card:#FFFFFF;--ink:#191714;--ink2:#5E5850;--line:#E1DACB;--alto:#C8341F;--alto-f:#FBE6E1;--medio:#8A6300;--medio-f:#FBF0D6;--bien:#2E6B3F;--bien-f:#E3F0E6;
  --entra:#2E7D4F;--sale:#C2563A;--acento:#191714;--r:14px;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--typ:"Courier Prime","Courier New",monospace;
  --safe-b:env(safe-area-inset-bottom,0px)}
@font-face{font-family:"Courier Prime";src:local("Courier Prime")}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 19px/1.45 var(--sans);min-height:100vh;padding-bottom:calc(150px + var(--safe-b))}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:560px;margin:0 auto;padding:0 18px}
.rotulo{position:sticky;top:0;z-index:20;background:var(--ink);color:#F0EEE6;font:400 13px/1 var(--typ);text-align:center;padding:9px 12px;letter-spacing:.04em}
header.cab{padding:22px 0 8px}
.neg{font:600 14px/1.3 var(--sans);color:var(--ink2);letter-spacing:.02em}
h1{font:300 38px/1.08 var(--sans);letter-spacing:-.03em;margin:8px 0 6px}h1 b{font-weight:700}
.fecha{font:400 16px/1.4 var(--typ);color:var(--ink2)}
h2{font:700 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:30px 0 12px}
.vista{display:none}.vista.on{display:block;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* tarjetas de atención: una idea cada una, se tocan para saber por qué */
.at{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:18px 18px 16px 22px;margin:0 0 12px;position:relative;box-shadow:0 2px 0 rgba(25,23,20,.06)}
.at::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:6px;border-radius:0 4px 4px 0;background:var(--c)}
.at[data-t="alto"]{--c:var(--alto);--f:var(--alto-f)}.at[data-t="medio"]{--c:var(--medio);--f:var(--medio-f)}.at[data-t="bien"]{--c:var(--bien);--f:var(--bien-f)}
.at .ob{font:600 14px/1.2 var(--sans);color:var(--c)}
.at .ti{font:700 22px/1.2 var(--sans);letter-spacing:-.01em;margin:6px 0 10px}
.at .tocar{display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--sans);color:var(--ink);background:var(--f);padding:10px 14px;border-radius:999px}
/* obras */
.obra{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:18px;margin:0 0 12px}
.obra .fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.obra .nom{font:700 22px/1.2 var(--sans)}.obra .pct{font:300 34px/1 var(--sans);letter-spacing:-.03em}
.obra .tip{font:400 15px/1.4 var(--typ);color:var(--ink2);margin:4px 0 12px}
.barra{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.barra i{display:block;height:100%;background:var(--ink);border-radius:7px}
.estado{display:inline-block;margin-top:12px;font:700 15px/1 var(--sans);padding:8px 12px;border-radius:999px;background:var(--f);color:var(--c)}
.estado[data-t="alto"]{--c:var(--alto);--f:var(--alto-f)}.estado[data-t="medio"]{--c:var(--medio);--f:var(--medio-f)}.estado[data-t="bien"]{--c:var(--bien);--f:var(--bien-f)}
/* una obra */
.volver{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font:600 17px var(--sans);padding:14px 0 4px;color:var(--ink2)}
.paso{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:10px 0}
.paso i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--sans);font-style:normal}
.paso[data-e="hecha"] i{background:var(--bien);color:#fff}.paso[data-e="en curso"] i{background:var(--ink);color:#fff}.paso[data-e="falta"] i{background:transparent;border:2px solid var(--line);color:var(--ink2)}
.paso span{font-size:19px}.paso[data-e="falta"] span{color:var(--ink2)}.paso em{font:400 14px var(--typ);color:var(--ink2);font-style:normal;display:block}
.caja{background:var(--card);border-radius:var(--r);padding:18px}
.flujo{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:end;height:170px;margin-top:6px}
.flujo button{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.flujo .e,.flujo .s{width:62%;border-radius:4px 4px 0 0}.flujo .e{background:var(--entra)}.flujo .s{background:var(--sale);border-radius:0 0 4px 4px}
.flujo small{font:400 13px var(--typ);color:var(--ink2);margin-top:4px}
.flujo button[aria-pressed="true"] small{color:var(--ink);font-weight:700}
.ley{display:flex;gap:16px;font:400 14px var(--typ);color:var(--ink2);margin-top:10px}.ley i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sem{margin-top:14px;padding:14px;border-radius:10px;background:var(--bg);font:400 17px/1.45 var(--sans)}
.sem b{font-weight:700}
.mat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:16px 18px;margin:0 0 10px}
.mat .n{font:700 19px/1.25 var(--sans)}.mat .q{font:400 15px var(--typ);color:var(--ink2)}
.mat .st{grid-row:1/3;grid-column:2;font:700 14px/1.2 var(--sans);padding:8px 10px;border-radius:999px;text-align:center;max-width:130px}
.st[data-s="llegó"]{background:var(--bien-f);color:var(--bien)}.st[data-s="por llegar"]{background:#E7ECF3;color:#2D4A73}.st[data-s="no comprar aún"]{background:var(--medio-f);color:var(--medio)}.st[data-s="comprar ya"]{background:var(--alto-f);color:var(--alto)}
.eq{display:flex;flex-wrap:wrap;gap:8px}.eq span{background:var(--card);border-radius:999px;padding:10px 14px;font:600 16px var(--sans)}
/* panorama: mapa de zonas hecho de papel */
.mapa{background:var(--card);border-radius:var(--r);padding:10px}
.mapa svg{width:100%;height:auto;display:block}
.zona{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:16px 18px;margin:0 0 10px}
.zona .n{font:700 20px/1.2 var(--sans)}.zona .ch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ch span{font:600 14px/1 var(--sans);padding:7px 10px;border-radius:999px;background:var(--bg)}
.proy{font:300 26px/1.25 var(--sans);letter-spacing:-.02em;margin-top:6px}.proy b{font-weight:700}
/* barra de abajo: tres lugares y «Platícale» */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(240,238,230,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b))}
nav.abajo .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
nav.abajo a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font:600 15px/1 var(--sans);color:var(--ink2);padding:8px 4px;border-radius:12px}
nav.abajo a svg{width:26px;height:26px}
nav.abajo a[aria-current]{color:var(--ink);background:var(--card)}
.platica{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:31;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--ink);color:#F0EEE6;font:700 18px var(--sans);padding:14px 22px 14px 14px;box-shadow:0 10px 28px rgba(25,23,20,.3)}
.orb{width:34px;height:34px;border-radius:50%;background:conic-gradient(#8C5ADC,#FF46AA,#FF6E28,#FFBE3C,#1EDC78,#2878FF,#8C5ADC);animation:gira 6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* hoja que explica «por qué» y la plática */
.velo{position:fixed;inset:0;z-index:40;background:rgba(25,23,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.hoja.on{transform:none}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.hoja .w{padding:0}
.hoja .k{font:600 14px var(--sans);color:var(--c,var(--ink2));letter-spacing:.04em}
.hoja h3{font:700 26px/1.15 var(--sans);letter-spacing:-.02em;margin:6px 0 12px}
.hoja .pq{font:400 19px/1.5 var(--typ);color:var(--ink)}
.hoja .acc{display:block;width:100%;margin-top:20px;border:0;border-radius:14px;padding:17px;background:var(--ink);color:#F0EEE6;font:700 19px var(--sans)}
.hoja .cerrar{display:block;width:100%;margin-top:10px;border:2px solid var(--ink);border-radius:14px;padding:15px;background:transparent;font:700 18px var(--sans)}
.burb{padding:12px 16px;border-radius:16px;margin:8px 0;font-size:18px;max-width:88%}
.burb.yo{background:var(--bg);margin-left:auto;border-bottom-right-radius:4px}.burb.al{background:#F6F3F8;border-bottom-left-radius:4px;font-family:var(--typ)}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sug button{text-align:left;border:2px solid var(--line);background:transparent;border-radius:12px;padding:13px 14px;font:600 17px var(--sans)}
.ok{font:400 15px var(--typ);color:var(--bien);margin-top:12px;min-height:20px}
.pie{font:400 14px/1.5 var(--typ);color:var(--ink2);margin:34px 0 0;text-align:center}
.pie a{color:inherit}
:focus-visible{outline:3px solid #2878FF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){h1{font-size:46px}}
</style>
</head>

<script>
(function(){
 const D=JSON.parse(document.getElementById('datos').textContent);
 const $=(s,e=document)=>e.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const obra=id=>D.obras.find(o=>o.id===id);
 const TONO={alto:'Necesita tu atención',medio:'Ojo con esto',bien:'Va bien'};
 const tonoObra=o=>{const a=D.atencion.filter(x=>x.obra===o.id);return a.some(x=>x.tono==='alto')?'alto':a.some(x=>x.tono==='medio')?'medio':'bien'};
 const miles=n=>'$'+Math.round(n).toLocaleString('es-MX')+' mil';
 // hoja: explica por qué, o la plática
 const hoja=$('#hoja'),velo=$('#velo'),hc=$('#hoja-c');let antes=null;
 function abre(html,c){antes=document.activeElement;hc.innerHTML=html;hoja.style.setProperty('--c',c||'var(--ink2)');hoja.classList.add('on');velo.classList.add('on');setTimeout(()=>{const f=hc.querySelector('button');f&&f.focus()},250)}
 function cierra(){hoja.classList.remove('on');velo.classList.remove('on');antes&&antes.focus()}
 velo.onclick=cierra;addEventListener('keydown',e=>{if(e.key==='Escape')cierra()});
 hc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cerrar!==undefined)cierra();if(b.dataset.ir){cierra();location.hash=b.dataset.ir}
  if(b.dataset.hecho!==undefined){$('.ok',hc).textContent='Hecho. En la app de verdad, alkimia lo manda sólo con tu sí.'}
  if(b.dataset.q!==undefined){const p=D.platica[+b.dataset.q];const ch=$('#chat',hc);ch.insertAdjacentHTML('beforeend',`<div class="burb yo">${esc(p.pregunta)}</div>`);setTimeout(()=>{ch.insertAdjacentHTML('beforeend',`<div class="burb al">${esc(p.respuesta)}</div>`);ch.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})},450)}});
 const cTono=t=>t==='alto'?'var(--alto)':t==='medio'?'var(--medio)':'var(--bien)';
 function porque(i){const a=D.atencion[i],o=obra(a.obra);
  abre(`<div class="k">${esc(TONO[a.tono])} · ${esc(o?o.nombre:'')}</div><h3 id="hoja-t">${esc(a.titulo)}</h3><p class="pq">${esc(a.porque)}</p>
   <button class="acc" data-hecho>${esc(a.accion)}</button><p class="ok" aria-live="polite"></p>${o?`<button class="cerrar" data-ir="obra-${o.id}">Ver la obra</button>`:''}<button class="cerrar" data-cerrar>Cerrar</button>`,cTono(a.tono))}
 // vistas
 function hoy(){const n=D.atencion.filter(a=>a.tono!=='bien').length;
  $('#v-hoy').innerHTML=`<header class="cab"><div class="neg">${esc(D.negocio)}</div><h1>Buenos días, ${esc(D.persona)}. <b>${n===0?'Todo va bien.':n===1?'Una cosa te necesita hoy.':['','','Dos','Tres','Cuatro','Cinco'][n]+' cosas te necesitan hoy.'}</b></h1><p class="fecha">${esc(D.hoy)} · toca cada una para saber por qué</p></header>
  <h2>Lo que necesita tu atención</h2>`+D.atencion.map((a,i)=>`<button class="at" data-t="${a.tono}" data-i="${i}"><div class="ob">${esc(TONO[a.tono])} · ${esc(obra(a.obra)?.nombre||'')}</div><div class="ti">${esc(a.titulo)}</div><span class="tocar">¿Por qué? →</span></button>`).join('')+
  `<h2>Tus obras</h2>`+D.obras.map(tarjObra).join('');
  $('#v-hoy').querySelectorAll('.at').forEach(b=>b.onclick=()=>porque(+b.dataset.i))}
 function tarjObra(o){const t=tonoObra(o);return `<a class="obra" href="#obra-${o.id}" style="text-decoration:none;color:inherit"><div class="fila"><span class="nom">${esc(o.nombre)}</span><span class="pct">${o.avance}%</span></div><div class="tip">${esc(o.zona)} · ${esc(o.etapa)}</div><div class="barra" role="img" aria-label="Avance ${o.avance} por ciento"><i style="width:${o.avance}%"></i></div><span class="estado" data-t="${t}">${esc(TONO[t])}</span></a>`}
 function obras(){$('#v-obras').innerHTML=`<header class="cab"><div class="neg">${esc(D.negocio)}</div><h1>Tus <b>obras</b>.</h1><p class="fecha">${D.obras.length} en marcha · toca una para verla</p></header>`+D.obras.map(tarjObra).join('')}
 let semSel={};
 function unaObra(id){const o=obra(id);if(!o){location.hash='obras';return}const at=D.atencion.map((a,i)=>[a,i]).filter(([a])=>a.obra===id);
  const S=o.flujo.semanas,mx=Math.max(1,...S.map(s=>Math.max(s.entra,s.sale)));const sel=semSel[id]??S.findIndex(s=>s.entra>0);const k=sel<0?0:sel;
  $('#v-obra').innerHTML=`<button class="volver" data-ir="obras">← Tus obras</button><header class="cab" style="padding-top:6px"><div class="neg">${esc(o.tipo)} · ${esc(o.zona)}</div><h1>${esc(o.nombre)}</h1><p class="fecha">Va en ${o.avance}% · ${esc(o.etapa)}</p></header>
   ${at.length?`<h2>Necesita tu atención</h2>`+at.map(([a,i])=>`<button class="at" data-t="${a.tono}" data-i="${i}"><div class="ob">${esc(TONO[a.tono])}</div><div class="ti">${esc(a.titulo)}</div><span class="tocar">¿Por qué? →</span></button>`).join(''):''}
   <h2>Avance</h2><div class="caja"><div class="barra" style="margin-bottom:10px"><i style="width:${o.avance}%"></i></div>${o.etapas.map((e,j)=>`<div class="paso" data-e="${e.estado}"><i>${e.estado==='hecha'?'✓':j+1}</i><span>${esc(e.nombre)}${e.nota?`<em>${esc(e.nota)}</em>`:''}</span></div>`).join('')}</div>
   <h2>El dinero de esta obra, semana a semana</h2><div class="caja"><div class="flujo" style="--n:${S.length}">${S.map((s,j)=>`<button aria-pressed="${j===k}" data-s="${j}" aria-label="${esc(s.sem)}: entra ${miles(s.entra)}, sale ${miles(s.sale)}"><span class="e" style="height:${s.entra/mx*58}%"></span><span class="s" style="height:${s.sale/mx*58}%"></span><small>${esc(s.sem)}</small></button>`).join('')}</div>
    <div class="ley"><span><i style="background:var(--entra)"></i>Entra</span><span><i style="background:var(--sale)"></i>Sale</span></div>
    <div class="sem" aria-live="polite"><b>${esc(S[k].sem)}:</b> entra ${miles(S[k].entra)}, sale ${miles(S[k].sale)}. ${S[k].entra-S[k].sale>=0?'<b style="color:var(--entra)">Esa semana te sobra.</b>':'<b style="color:var(--sale)">Esa semana sale más de lo que entra.</b>'}</div>
    <p class="fecha" style="margin-top:12px">${esc(o.flujo.nota)}</p></div>
   ${o.materiales.length?`<h2>Materiales</h2>`+o.materiales.map((m,j)=>`<button class="mat" data-m="${j}"><span class="n">${esc(m.nombre)}</span><span class="q">${esc(m.cantidad)} · ${esc(m.cuando)}</span><span class="st" data-s="${esc(m.estado)}">${esc(m.estado)}</span></button>`).join(''):''}
   <h2>Tu equipo en esta obra</h2><div class="eq">${o.equipo.map(e=>`<span>${e.cuantos} ${esc(e.rol.toLowerCase())}</span>`).join('')}</div>`;
  const v=$('#v-obra');v.querySelector('.volver').onclick=()=>location.hash='obras';
  v.querySelectorAll('.at').forEach(b=>b.onclick=()=>porque(+b.dataset.i));
  v.querySelectorAll('.flujo button').forEach(b=>b.onclick=()=>{semSel[id]=+b.dataset.s;const y=scrollY;unaObra(id);scrollTo(0,y)});
  v.querySelectorAll('.mat').forEach(b=>b.onclick=()=>{const m=o.materiales[+b.dataset.m];abre(`<div class="k">${esc(o.nombre)}</div><h3 id="hoja-t">${esc(m.nombre)}: ${esc(m.estado)}</h3><p class="pq">${esc(m.cantidad)} · ${esc(m.cuando)}.</p><p class="pq" style="margin-top:10px">${esc(m.porque)}</p><button class="cerrar" data-cerrar>Cerrar</button>`,m.estado==='no comprar aún'?'var(--medio)':'var(--ink2)')})}
 function panorama(){const P=D.panorama,col={alta:'#C8341F',media:'#D4A27F',baja:'#E1DACB'};
  const pos=[[80,132,62],[196,212,44],[196,54,44],[204,136,34],[300,132,40]]; /* poniente, sur, norte, centro, oriente: como en un mapa */
  $('#v-panorama').innerHTML=`<header class="cab"><div class="neg">${esc(D.negocio)}</div><h1>${esc(P.titulo)}.</h1><p class="fecha">Dónde se mueve la obra y dónde está más barato el terreno · ejemplo</p></header>
   <div class="mapa"><svg viewBox="0 0 360 260" role="img" aria-label="Mapa de zonas de ejemplo"><rect width="360" height="260" fill="#F6F3EC"/><path d="M0 176 C 80 156 140 196 210 176 S 320 146 360 166" stroke="#E1DACB" stroke-width="10" fill="none"/><text x="340" y="22" font-family="Helvetica Neue,Helvetica,Arial" font-size="12" fill="#5E5850" text-anchor="end">N ↑</text>
    ${P.zonas.map((z,i)=>{const p=pos[i%pos.length];return `<g><circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="${col[z.obra]}" opacity=".85"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial" font-weight="700" font-size="14" fill="${z.obra==='alta'?'#fff':'#191714'}">${esc(z.nombre)}</text></g>`}).join('')}</svg>
    <div class="ley" style="padding:4px 8px 6px"><span><i style="background:#C8341F"></i>mucha obra</span><span><i style="background:#D4A27F"></i>media</span><span><i style="background:#E1DACB"></i>poca</span></div></div>
   <h2>Zona por zona</h2>${P.zonas.map(z=>`<div class="zona"><div class="n">${esc(z.nombre)}</div><div class="ch"><span>obra ${esc(z.obra)}</span><span>terreno ${esc(z.terreno)}</span></div><p class="fecha" style="margin-top:8px">${esc(z.nota)}</p></div>`).join('')}
   <h2>Lo que podrías llevar</h2><div class="caja"><p class="proy">${P.proyeccion}</p></div>`}
 function platica(){abre(`<div class="k">alkimia</div><h3 id="hoja-t">Pregúntale como le preguntarías a tu residente.</h3><div id="chat"></div><div class="sug">${D.platica.map((p,i)=>`<button data-q="${i}">${esc(p.pregunta)}</button>`).join('')}</div><p class="fecha" style="margin-top:14px">En la app de verdad le hablas con tu voz y también puedes pedirle que cambie lo que ves aquí.</p><button class="cerrar" data-cerrar>Cerrar</button>`)}
 $('#platica').onclick=platica;
 document.body.addEventListener('click',e=>{const b=e.target.closest('[data-ir]');if(b&&!hoja.contains(b)){location.hash=b.dataset.ir}});
 function ve(){const h=(location.hash||'#hoy').slice(1);let v=h.startsWith('obra-')?'obra':h;if(!['hoy','obras','obra','panorama'].includes(v))v='hoy';
  document.querySelectorAll('.vista').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav.abajo a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===(v==='obra'?'obras':v)));
  if(v==='hoy')hoy();else if(v==='obras')obras();else if(v==='obra')unaObra(h.slice(5));else panorama();scrollTo(0,0)}
 addEventListener('hashchange',ve);ve();
})();
</script>
</body>
</html>
